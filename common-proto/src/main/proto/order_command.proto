syntax = "proto3";

package com.exchange.common.proto;

option java_package = "com.exchange.common.proto";
option java_outer_classname = "OrderProto";
option java_multiple_files = false;

/**
 * ============================================
 * Phase 2.1: Protobuf Schemas
 * Order Command 序列化定义
 * ============================================
 *
 * 性能提升：
 * - 序列化延迟：从 ms 级降到 μs 级（10-50倍）
 * - 消息体积：减少 30-60%
 * - CPU 占用：降低
 *
 * 注意事项：
 * - 字段编号不能修改（向后兼容）
 * - 新增字段必须使用新编号
 * - 删除字段应标记 reserved
 */

/**
 * 订单命令消息
 * 用于 OMS → Match Engine 通信
 */
message OrderCommand {
  // 订单ID
  int64 order_id = 1;

  // 用户ID
  int64 user_id = 2;

  // 交易对
  string symbol = 3;

  // 买卖方向（BUY, SELL）
  string side = 4;

  // 订单类型（LIMIT, MARKET）
  string order_type = 5;

  // 价格（字符串，避免精度问题）
  string price = 6;

  // 数量（字符串，避免精度问题）
  string quantity = 7;

  // 事件类型（ORDER_SUBMIT, ORDER_CANCEL, ORDER_FORCE_CANCEL）
  string event_type = 8;

  // 时间戳（毫秒）
  int64 timestamp = 9;

  // 客户端订单ID（可选）
  string client_order_id = 10;
}

/**
 * 批量订单命令（预留，用于批量下单优化）
 */
message OrderCommandBatch {
  // 批量订单
  repeated OrderCommand commands = 1;

  // 批次ID
  string batch_id = 2;

  // 批次时间戳
  int64 batch_timestamp = 3;
}
