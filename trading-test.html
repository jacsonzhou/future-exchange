<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合约交易所验证系统</title>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #58a6ff; font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #f85149; }
        .btn-secondary { background: #30363d; color: #c9d1d9; }
        .btn-secondary:hover { background: #484f58; }
        
        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 20px;
            margin-top: 20px;
        }
        
        /* Card */
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        /* Auth Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            max-width: 90%;
        }
        .modal h2 { margin-bottom: 20px; color: #58a6ff; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            cursor: pointer;
        }
        .tab.active {
            background: #238636;
            color: white;
            border-color: #238636;
        }
        
        /* Balance Display */
        .balance-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #21262d;
        }
        .balance-item:last-child { border-bottom: none; }
        .balance-label { color: #8b949e; font-size: 13px; }
        .balance-value { font-weight: 600; color: #3fb950; }
        
        /* Order Book */
        .orderbook {
            font-family: monospace;
            font-size: 13px;
        }
        .orderbook-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            color: #8b949e;
            font-size: 11px;
            padding: 8px 0;
            border-bottom: 1px solid #30363d;
        }
        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 4px 0;
            cursor: pointer;
        }
        .orderbook-row:hover { background: #21262d; }
        .orderbook-ask { color: #f85149; }
        .orderbook-bid { color: #3fb950; }
        .orderbook-spread {
            text-align: center;
            padding: 8px 0;
            color: #8b949e;
            font-size: 12px;
            border-top: 1px solid #30363d;
            border-bottom: 1px solid #30363d;
        }
        
        /* Trading Form */
        .trade-tabs {
            display: flex;
            margin-bottom: 15px;
        }
        .trade-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #21262d;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-weight: 600;
        }
        .trade-tab.buy { border-radius: 6px 0 0 6px; }
        .trade-tab.sell { border-radius: 0 6px 6px 0; }
        .trade-tab.active.buy { background: #238636; color: white; }
        .trade-tab.active.sell { background: #da3633; color: white; }
        
        /* Log Panel */
        .log-panel {
            height: 300px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #21262d;
        }
        .log-time { color: #8b949e; }
        .log-info { color: #58a6ff; }
        .log-success { color: #3fb950; }
        .log-error { color: #f85149; }
        .log-warn { color: #d29922; }
        
        /* WebSocket Status */
        .ws-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #21262d;
        }
        .ws-status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .ws-status.connected { color: #3fb950; }
        .ws-status.connected::before { background: #3fb950; }
        .ws-status.disconnected { color: #f85149; }
        .ws-status.disconnected::before { background: #f85149; }
        .ws-status.connecting { color: #d29922; }
        .ws-status.connecting::before { background: #d29922; }
        
        /* Kline Chart */
        .kline-container {
            height: 400px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            position: relative;
        }
        .kline-chart {
            width: 100%;
            height: 100%;
        }
        .kline-toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            gap: 5px;
        }
        .kline-toolbar button {
            padding: 4px 10px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .kline-toolbar button:hover { background: #30363d; }
        .kline-toolbar button.active { 
            background: #238636; 
            border-color: #238636;
            color: white;
        }
        .kline-price {
            position: absolute;
            top: 10px;
            right: 60px;
            z-index: 10;
            font-size: 18px;
            font-weight: 600;
            font-family: monospace;
        }
        .kline-price.up { color: #3fb950; }
        .kline-price.down { color: #f85149; }
        
        /* Trades */
        .trade-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .trade-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
            border-bottom: 1px solid #21262d;
        }
        .trade-price { font-family: monospace; }
        .trade-buy { color: #3fb950; }
        .trade-sell { color: #f85149; }
        
        /* Hidden */
        .hidden { display: none !important; }
        
        /* Order & Position Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .data-table th {
            text-align: left;
            padding: 8px;
            color: #8b949e;
            font-weight: 500;
            border-bottom: 1px solid #30363d;
        }
        .data-table td {
            padding: 8px;
            border-bottom: 1px solid #21262d;
        }
        .data-table tr:hover {
            background: #21262d;
        }
        .data-table .side-buy { color: #3fb950; }
        .data-table .side-sell { color: #f85149; }
        .data-table .pnl-positive { color: #3fb950; }
        .data-table .pnl-negative { color: #f85149; }
        
        /* Order status badges */
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-new { background: #1f6feb; color: white; }
        .status-partial { background: #d29922; color: #0d1117; }
        .status-filled { background: #238636; color: white; }
        .status-cancelled { background: #484f58; color: #8b949e; }
        .order-action-btn {
            padding: 3px 10px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .order-action-cancel {
            background: #da3633;
            color: #ffffff;
        }
        .order-action-cancel:hover:not(:disabled) {
            background: #f85149;
        }
        .order-action-btn:disabled {
            background: #484f58;
            color: #8b949e;
            cursor: not-allowed;
        }
        
        /* Position card */
        .position-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .position-symbol {
            font-weight: 600;
            font-size: 14px;
        }
        .position-side {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .position-side.long { background: #238636; color: white; }
        .position-side.short { background: #da3633; color: white; }
        .position-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }
        .position-detail-item {
            display: flex;
            justify-content: space-between;
        }
        .position-detail-label {
            color: #8b949e;
        }
        .position-detail-value {
            font-family: monospace;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <h2>合约交易系统</h2>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">登录</button>
                <button class="tab" onclick="switchTab('register')">注册</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary" style="width:100%" onclick="login()">登录</button>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="regEmail" placeholder="请输入邮箱">
                </div>
                <button class="btn btn-primary" style="width:100%" onclick="register()">注册</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <div class="header">
            <h1>🚀 合约交易验证系统</h1>
            <div class="user-info">
                <span id="currentUser">未登录</span>
                <span id="publicWsStatus" class="ws-status disconnected">公有推送</span>
                <span id="privateWsStatus" class="ws-status disconnected">私有推送</span>
                <button class="btn btn-secondary" onclick="refreshBalance()">刷新余额</button>
                <button class="btn btn-danger" onclick="logout()">退出</button>
            </div>
        </div>

        <div class="container">
            <div class="main-layout">
                <!-- Left Column: 盘口深度 + 最新成交 -->
                <div class="left-column">
                    <!-- Order Book -->
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                            <div class="card-title" style="margin:0;">📗 盘口深度</div>
                            <div style="display:flex;gap:5px;">
                                <button onclick="forceRefreshOrderBook()" style="padding:4px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:11px;">🔄 刷新</button>
                                <button onclick="resubscribeDepth()" style="padding:4px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:11px;">📡 重连</button>
                            </div>
                        </div>
                        <div class="orderbook">
                            <div class="orderbook-header">
                                <span>价格</span>
                                <span>数量</span>
                                <span>累计</span>
                            </div>
                            <div id="orderbookAsks" style="text-align:center;padding:20px;color:#8b949e;">等待数据...</div>
                            <div class="orderbook-spread" id="orderbookSpread">--</div>
                            <div id="orderbookBids" style="text-align:center;padding:20px;color:#8b949e;">等待数据...</div>
                        </div>
                    </div>

                    <!-- Recent Trades -->
                    <div class="card">
                        <div class="card-title">📊 全市场最新成交</div>
                        <div class="trade-list" id="tradeList">
                            <div style="text-align:center;color:#8b949e;padding:20px;">等待数据...</div>
                        </div>
                    </div>
                </div>

                <!-- Center Column: K线图表 + 订单/持仓 -->
                <div class="center-column">
                    <!-- Kline Chart -->
                    <div class="card">
                        <div class="card-title">📈 K线图表 (BTCUSDT)</div>
                        <div class="kline-container" id="klineContainer">
                            <div class="kline-toolbar">
                                <button onclick="changeKlineInterval('1m')" class="kline-interval-btn active" data-interval="1m">1m</button>
                                <button onclick="changeKlineInterval('5m')" class="kline-interval-btn" data-interval="5m">5m</button>
                                <button onclick="changeKlineInterval('15m')" class="kline-interval-btn" data-interval="15m">15m</button>
                                <button onclick="changeKlineInterval('1h')" class="kline-interval-btn" data-interval="1h">1h</button>
                            </div>
                            <div class="kline-price" id="klineCurrentPrice">--</div>
                            <div class="kline-chart" id="klineChart"></div>
                        </div>
                    </div>
                    
                    <!-- 订单 & 持仓 Tab -->
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                            <div class="card-title" style="margin:0;">📋 资产与委托</div>
                            <div style="display:flex;gap:5px;">
                                <button class="btn btn-sm" id="tabPositionsBtn" onclick="switchBottomTab('positions')" style="padding:6px 16px;background:#238636;color:white;border:none;border-radius:4px;cursor:pointer;">持仓</button>
                                <button class="btn btn-sm" id="tabOrdersBtn" onclick="switchBottomTab('orders')" style="padding:6px 16px;background:#30363d;color:#c9d1d9;border:none;border-radius:4px;cursor:pointer;">订单</button>
                            </div>
                        </div>
                        
                        <!-- 订单列表 -->
                        <div id="ordersPanel" style="display:none;">
                            <div style="display:flex;gap:10px;margin-bottom:10px;">
                                <button class="btn btn-sm" onclick="loadOrders('active')" style="padding:4px 12px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:12px;">当前委托</button>
                                <button class="btn btn-sm" onclick="loadOrders('history')" style="padding:4px 12px;background:transparent;color:#8b949e;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:12px;">历史委托</button>
                            </div>
                            <div id="ordersList" style="max-height:250px;overflow-y:auto;">
                                <div style="text-align:center;color:#8b949e;padding:30px;">
                                    <div>加载中...</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 持仓列表 -->
                        <div id="positionsPanel">
                            <div id="positionsSummary" style="display:flex;gap:20px;margin-bottom:15px;padding:10px;background:#0d1117;border-radius:6px;">
                                <div>
                                    <div style="font-size:11px;color:#8b949e;">总未实现盈亏</div>
                                    <div id="totalUnrealizedPnl" style="font-size:16px;font-weight:600;color:#3fb950;">--</div>
                                </div>
                            </div>
                            <div id="positionsList" style="max-height:220px;overflow-y:auto;">
                                <div style="text-align:center;color:#8b949e;padding:30px;">
                                    <div>暂无持仓</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: 账户余额 + 下单交易 + WebSocket日志 -->
                <div class="right-column">
                    <!-- Balance Card (放在下单交易上方) -->
                    <div class="card">
                        <div class="card-title">💰 账户余额</div>
                        <div id="balanceContainer">
                            <div class="balance-item">
                                <span class="balance-label">可用余额</span>
                                <span class="balance-value" id="availableBalance">--</span>
                            </div>
                            <div class="balance-item">
                                <span class="balance-label">冻结金额</span>
                                <span class="balance-value" id="frozenBalance">--</span>
                            </div>
                            <div class="balance-item">
                                <span class="balance-label">持仓保证金</span>
                                <span class="balance-value" id="marginBalance">--</span>
                            </div>
                            <div class="balance-item">
                                <span class="balance-label">总资产</span>
                                <span class="balance-value" id="totalBalance">--</span>
                            </div>
                        </div>
                    </div>

                    <!-- Trading Form -->
                    <div class="card">
                        <div class="card-title">📝 下单交易</div>
                        <div class="trade-tabs">
                            <button class="trade-tab buy active" onclick="switchTradeSide('BUY', this)">买入/做多</button>
                            <button class="trade-tab sell" onclick="switchTradeSide('SELL', this)">卖出/做空</button>
                        </div>
                        
                        <div class="form-group">
                            <label>交易对</label>
                            <select id="symbol">
                                <option value="BTCUSDT">BTCUSDT</option>
                                <option value="ETHUSDT">ETHUSDT</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>订单类型</label>
                            <select id="orderType">
                                <option value="LIMIT">限价单</option>
                                <option value="MARKET">市价单</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>价格 (USDT)</label>
                            <input type="number" id="price" placeholder="输入价格" step="0.01">
                        </div>
                        
                        <div class="form-group">
                            <label>数量 (BTC)</label>
                            <input type="number" id="quantity" placeholder="输入数量" step="0.01">
                        </div>
                        
                        <div class="form-group">
                            <label>杠杆倍数</label>
                            <select id="leverage">
                                <option value="1">1x</option>
                                <option value="5">5x</option>
                                <option value="10" selected>10x</option>
                                <option value="20">20x</option>
                                <option value="50">50x</option>
                                <option value="100">100x</option>
                            </select>
                        </div>
                        
                        <button class="btn btn-primary" style="width:100%" id="submitOrderBtn" onclick="submitOrder()">买入下单</button>
                    </div>

                    <!-- WebSocket Log -->
                    <div class="card">
                        <div class="card-title">📡 WebSocket 日志</div>
                        <div class="log-panel" id="logPanel">
                            <div class="log-entry"><span class="log-time">系统</span> <span class="log-info">等待连接...</span></div>
                        </div>
                        <div style="margin-top:10px;display:flex;gap:10px;">
                            <button class="btn btn-secondary" style="flex:1" onclick="clearLogs()">清空日志</button>
                            <button class="btn btn-secondary" style="flex:1" onclick="reconnectWs()">重连WS</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            API_GATEWAY: 'http://localhost:8082',
            MARKET_PRICE_API: 'http://localhost:8095',  // market-price-core 直接访问
            PUBLIC_PUSH_WS: 'ws://localhost:8096/ws/market',
            PRIVATE_PUSH_WS: 'ws://localhost:8097/ws/private',
            SNAPSHOT_ACCOUNT: 'http://localhost:8085'  // 直接查询余额
        };

        // 临时方案：直接访问 snapshot 服务（绕过 API Gateway）
        const USE_DIRECT_SNAPSHOT = true;

        // ==================== 状态 ====================
        let state = {
            token: localStorage.getItem('token'),
            userId: localStorage.getItem('userId'),
            username: localStorage.getItem('username'),
            tradeSide: 'BUY',
            publicWs: null,
            privateWs: null,
            isAuthenticated: false,
            currentBottomTab: 'positions',  // positions | orders
            currentOrderFilter: 'active' // active | history
        };

        let positionRefreshTimer = null;
        let publicReconnectTimer = null;
        let privateReconnectTimer = null;

        // 清理历史残留的无效 token（例如字符串 "undefined"/"null"）
        state.token = normalizeToken(state.token);

        // ==================== 认证相关 ====================
        function normalizeToken(rawToken) {
            if (rawToken === undefined || rawToken === null) return null;
            let token = String(rawToken).trim();
            if (!token || token === 'undefined' || token === 'null') return null;
            if ((token.startsWith('"') && token.endsWith('"')) ||
                (token.startsWith("'") && token.endsWith("'"))) {
                token = token.substring(1, token.length - 1).trim();
            }
            if (token.startsWith('Bearer ')) {
                token = token.substring(7).trim();
            }
            return token || null;
        }

        function isLikelyJwt(token) {
            if (!token || typeof token !== 'string') return false;
            return /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token);
        }

        function decodeJwtPayload(token) {
            if (!isLikelyJwt(token)) return null;
            try {
                const parts = token.split('.');
                if (parts.length < 2) return null;
                const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const pad = '='.repeat((4 - base64.length % 4) % 4);
                const json = atob(base64 + pad);
                return JSON.parse(json);
            } catch (_) {
                return null;
            }
        }

        function restoreUserContextFromToken() {
            if (!state.token || !isLikelyJwt(state.token)) return;
            const payload = decodeJwtPayload(state.token);
            if (!payload) return;

            if (!state.userId) {
                const inferredUserId = payload.userId ?? payload.uid ?? payload.sub ?? payload.id;
                if (inferredUserId !== undefined && inferredUserId !== null && String(inferredUserId).trim() !== '') {
                    state.userId = String(inferredUserId);
                    localStorage.setItem('userId', state.userId);
                }
            }

            if (!state.username) {
                const inferredUsername = payload.username ?? payload.userName ?? payload.name;
                if (inferredUsername) {
                    state.username = String(inferredUsername);
                    localStorage.setItem('username', state.username);
                }
            }
        }

        function normalizeDepthLevels(levels, side) {
            if (!Array.isArray(levels)) return [];
            const parsed = [];
            levels.forEach(item => {
                const price = Array.isArray(item)
                    ? item[0]
                    : (item.price ?? item.p ?? item.askPrice ?? item.bidPrice ?? item.offerPrice);
                const qty = Array.isArray(item)
                    ? item[1]
                    : (item.qty ?? item.q ?? item.quantity ?? item.size ?? item.volume ?? item.askQty ?? item.bidQty);
                const priceNum = normalizePriceNumber(price);
                const qtyNum = normalizeQtyNumber(qty);
                if (!Number.isFinite(priceNum) || !Number.isFinite(qtyNum) || qtyNum <= 0) {
                    return;
                }
                parsed.push({ price: priceNum, qty: qtyNum });
            });

            parsed.sort((a, b) => side === 'ask' ? (a.price - b.price) : (b.price - a.price));
            return parsed.slice(0, 8);
        }

        // 更新盘口显示
        function updateOrderBookDisplay(data) {
            if (!data) return;
            
            const asksAsc = normalizeDepthLevels(data.asks, 'ask'); // 低价 -> 高价
            const bidsDesc = normalizeDepthLevels(data.bids, 'bid'); // 高价 -> 低价

            // 卖单累计按最优卖价向外累加，再倒序显示（高价在上）
            if (asksAsc.length > 0) {
                let askCum = 0;
                const asksWithCum = asksAsc.map(level => {
                    askCum += level.price * level.qty;
                    return { ...level, cum: askCum };
                });
                const asksToRender = asksWithCum.slice().reverse();

                let asksHtml = '';
                asksToRender.forEach(level => {
                    const displayPrice = Number(level.price.toFixed(2));
                    const displayQty = Number(level.qty.toFixed(2));
                    const displayCum = Number(level.cum.toFixed(2));
                    asksHtml += `
                        <div class="orderbook-row orderbook-ask">
                            <span class="orderbook-price">${displayPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                            <span class="orderbook-qty">${displayQty.toFixed(2)}</span>
                            <span class="orderbook-total">${displayCum.toFixed(2)}</span>
                        </div>
                    `;
                });
                document.getElementById('orderbookAsks').innerHTML = asksHtml;
            } else {
                document.getElementById('orderbookAsks').innerHTML = '<div style="text-align:center;padding:10px;color:#8b949e;">暂无卖单</div>';
            }
            
            // 买单累计按最优买价向外累加
            if (bidsDesc.length > 0) {
                let bidCum = 0;
                let bidsHtml = '';
                bidsDesc.forEach(level => {
                    bidCum += level.price * level.qty;
                    const displayPrice = Number(level.price.toFixed(2));
                    const displayQty = Number(level.qty.toFixed(2));
                    const displayCum = Number(bidCum.toFixed(2));
                    bidsHtml += `
                        <div class="orderbook-row orderbook-bid">
                            <span class="orderbook-price">${displayPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                            <span class="orderbook-qty">${displayQty.toFixed(2)}</span>
                            <span class="orderbook-total">${displayCum.toFixed(2)}</span>
                        </div>
                    `;
                });
                document.getElementById('orderbookBids').innerHTML = bidsHtml;
            } else {
                document.getElementById('orderbookBids').innerHTML = '<div style="text-align:center;padding:10px;color:#8b949e;">暂无买单</div>';
            }
            
            // 价差

                const spread = asksAsc[0].price - bidsDesc[0].price;
                document.getElementById('orderbookSpread').textContent = `价差: ${spread.toFixed(2)} USDT`;
            }
        }

        // 优先使用 market-price-core，兼容网关旧路由
        async function fetchDepthSnapshot(symbol) {
            // 1) market-price-core: /api/v1/depth?symbol=BTCUSDT&limit=20
            try {
                const res = await fetch(`${CONFIG.MARKET_PRICE_API}/api/v1/depth?symbol=${encodeURIComponent(symbol)}&limit=20`);
                if (res.ok) {
                    const payload = await res.json();
                    const data = payload.data || payload;
                    return {
                        bids: data.bids || [],
                        asks: data.asks || [],
                        timestamp: data.messageOutputTime || Date.now()
                    };
                }
            } catch (_) {}

            // 2) gateway fallback: /api/v1/depth?symbol=BTCUSDT&limit=20
            try {
                const res = await fetch(`${CONFIG.API_GATEWAY}/api/v1/depth?symbol=${encodeURIComponent(symbol)}&limit=20`);
                if (res.ok) {
                    const data = await res.json();
                    return {
                        bids: data.bids || [],
                        asks: data.asks || [],
                        timestamp: data.timestamp || Date.now()
                    };
                }
            } catch (_) {}

            // 3) match-engine fallback: /api/v1/match/orderbook/depth/{symbol}?depth=20
            try {
                const res = await fetch(`${CONFIG.API_GATEWAY}/api/v1/match/orderbook/depth/${symbol}?depth=20`);
                if (res.ok) {
                    const data = await res.json();
                    return {
                        bids: data.bids || [],
                        asks: data.asks || [],
                        timestamp: data.timestamp || Date.now()
                    };
                }
            } catch (_) {}

            return null;
        }
        
        function resubscribeDepth() {

                log('warn', '⚠️ WebSocket 未连接，执行重连...');

        // ==================== 余额查询 ====================
        async function refreshBalance() {
            try {
                // 检查登录状态
                if (!state.token) {
                    log('warn', '未登录，无法查询余额');
                    return;
                }
                
                // 通过 API Gateway 查询余额（userId 从 JWT Token 自动获取）
                const balanceUrl = `${CONFIG.API_GATEWAY}/api/v1/account/balance`;
                log('info', `查询余额: ${balanceUrl}`);
                
                const res = await fetch(balanceUrl, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${state.token}`,
                        'Accept': 'application/json'
                    },
                    mode: 'cors',
                    credentials: 'omit'
                });
                
                if (res.ok) {
                    const responseText = await res.text();
                    log('info', `余额响应: ${responseText.substring(0, 200)}`);
                    
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (parseErr) {
                        log('error', 'JSON解析失败: ' + parseErr.message);
                        return;
                    }
                    
                    // 处理直接返回快照数据或统一响应格式
                    const snapshot = data.data || data;
                    const available = snapshot.available ? parseFloat(snapshot.available) : 0;
                    const frozen = snapshot.frozen ? parseFloat(snapshot.frozen) : 0;
                    const positionMargin = snapshot.positionMargin ? parseFloat(snapshot.positionMargin) : 0;
                    
                    // 🔥 查询OMS预扣保证金（从OMS服务）
                    let preHoldMargin = 0;
                    if (state.userId) {
                        try {
                            const preHoldRes = await fetch(`${CONFIG.API_GATEWAY}/api/v1/oms/prehold/${state.userId}`, {
                                headers: { 'Authorization': `Bearer ${state.token}` }
                            });
                            if (preHoldRes.ok) {
                                const preHoldData = await preHoldRes.json();
                                preHoldMargin = preHoldData.data || preHoldData.preHold || 0;
                            }
                        } catch (e) {
                            // OMS预扣查询失败，继续显示已知余额
                            log('warn', '预扣保证金查询失败: ' + e.message);
                        }
                    }
                    
                    // 计算余额显示
                    // equity = 账户权益（总资金）
                    // available = 可用余额（可能为负，表示借入资金）
                    // frozen = 冻结保证金
                    const equityNum = snapshot.equity ? parseFloat(snapshot.equity) : 0;
                    const actualAvailable = available - preHoldMargin;
                    const totalFrozen = frozen + preHoldMargin;
                    
                    document.getElementById('availableBalance').textContent = formatMoneyDirect(actualAvailable);
                    document.getElementById('availableBalance').style.color = actualAvailable < 0 ? '#f85149' : '#3fb950';
                    document.getElementById('frozenBalance').textContent = formatMoneyDirect(totalFrozen);
                    document.getElementById('marginBalance').textContent = formatMoneyDirect(positionMargin);
                    document.getElementById('totalBalance').textContent = formatMoneyDirect(equityNum);
                    
                    log('success', `余额刷新成功: 可用=${actualAvailable.toFixed(2)} USDT (预扣=${preHoldMargin.toFixed(2)})`);
                    return;
                } else {
                    const errorText = await res.text();
                    log('error', `余额查询失败 [${res.status}]: ${errorText}`);
                }
            } catch (err) {
                log('error', `余额查询异常: ${err.name}: ${err.message}`);
                console.error('余额查询完整错误:', err);
                // 显示网络错误提示
                if (err.name === 'TypeError' && err.message.includes('fetch')) {
                    log('error', '网络连接失败，请检查: 1) API Gateway 是否运行 2) 是否存在跨域问题');
                }
            }
        }

        function getBestBidAsk() {
            const bidRaw = wsOrderBookData?.bids?.[0]?.[0] ?? currentOrderBook?.bids?.[0]?.[0];
            const askRaw = wsOrderBookData?.asks?.[0]?.[0] ?? currentOrderBook?.asks?.[0]?.[0];
            return {
                bestBid: normalizePriceNumber(bidRaw),
                bestAsk: normalizePriceNumber(askRaw)
            };
        }

        function isLikelyPriceQtySwapped(price, quantity) {
            if (!Number.isFinite(price) || !Number.isFinite(quantity) || price <= 0 || quantity <= 0) {
                return false;
            }
            const { bestBid, bestAsk } = getBestBidAsk();
            const marketRef = Number.isFinite(bestAsk) && bestAsk > 0
                ? bestAsk
                : (Number.isFinite(bestBid) && bestBid > 0 ? bestBid : 0);

            // 价格极低 + 数量极大，且偏离当前盘口，强烈怀疑写反（如 1 USDT 买 70000 BTC）
            if (price <= 10 && quantity >= 1000) {
                return true;
            }
            if (marketRef > 0 && price < marketRef * 0.05 && quantity >= 100) {
                return true;
            }
            return false;
        }

        async function submitOrder() {
            const symbol = document.getElementById('symbol').value;
            const orderType = document.getElementById('orderType').value;
            const rawPrice = parseFloat(document.getElementById('price').value);
            const rawQuantity = parseFloat(document.getElementById('quantity').value);
            const leverage = parseInt(document.getElementById('leverage').value);
            
            if (!rawQuantity || rawQuantity <= 0) {
                alert('请输入有效数量');
                return;
            }
            
            if (orderType === 'LIMIT' && (!rawPrice || rawPrice <= 0)) {
                alert('限价单请输入有效价格');
                return;
            }

            const price = orderType === 'MARKET' ? 0 : Number(rawPrice.toFixed(2));
            const quantity = Number(rawQuantity.toFixed(2));

            if (orderType === 'LIMIT' && isLikelyPriceQtySwapped(price, quantity)) {
                const proceedAsIs = confirm(
                    `检测到参数可能写反：当前价格=${price}，数量=${quantity}。\n` +
                    `点击“确定”按当前参数继续下单；点击“取消”将自动交换为 价格=${quantity}、数量=${price} 并取消本次提交。`
                );
                if (!proceedAsIs) {
                    document.getElementById('price').value = quantity;
                    document.getElementById('quantity').value = price;
                    log('warn', `已交换输入框参数: price=${quantity}, quantity=${price}，请确认后重新下单`);
                    return;
                }
            }

            // 统一按十进制字符串下单，避免前端和OMS重复缩放导致数量放大
            const priceDecimal = orderType === 'MARKET' ? '0' : Number(price).toFixed(8);
            const quantityDecimal = Number(quantity).toFixed(8);

            const request = {
                symbol: symbol,
                side: state.tradeSide,
                type: orderType,  // 注意：OMS期望字段名是 type 而不是 orderType
                price: priceDecimal,
                quantity: quantityDecimal,
                leverage: leverage,
                timeInForce: 'GTC',  // 默认有效期类型
                clientOrderId: `web_${Date.now()}`
            };

            try {
                const btnText = document.getElementById('submitOrderBtn')?.textContent || '';
                log('info', `下单方向确认: side=${state.tradeSide}, 按钮=${btnText}`);
                log('info', `提交订单: ${state.tradeSide} ${symbol} ${orderType} 价格:${price} 数量:${quantity}`);
                log('debug', `下单入参: price=${priceDecimal}, quantity=${quantityDecimal}`);
                
                // 使用 API Gateway 路由路径 /api/order/create
                const res = await fetch(`${CONFIG.API_GATEWAY}/api/order/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`,
                        'X-Idempotency-Key': `idem_${Date.now()}`
                    },
                    body: JSON.stringify(request)
                });

                const data = await res.json().catch(() => ({}));
                const apiCode = Number(data.code ?? data.status ?? data.data?.code);
                const success = res.ok && (
                    data.success === true ||
                    apiCode === 0 ||
                    apiCode === 200 ||
                    data.code === "SUCCESS" ||
                    data.status === "OK"
                );

                if (success) {
                    const orderId = data.orderId || data.data?.orderId || data.data?.id;
                    log('success', `订单提交成功: ${orderId}`);
                    
                    // 跟踪用户挂单（用于K线显示）
                    if (orderType === 'LIMIT' && orderId) {
                        userPendingOrders.set(String(orderId), {
                            orderId: String(orderId),
                            price: parseFloat(price),
                            side: state.tradeSide,
                            quantity: parseFloat(quantity),
                            symbol: symbol
                        });
                        log('info', `挂单跟踪: ${state.tradeSide} ${price} @ ${quantity}`);
                        // 刷新用户挂单显示
                        refreshUserOrdersOnKline();
                    }
                    
                    alert('订单提交成功！');
                    refreshBalance();
                    // 盘口数据会通过 WebSocket 自动更新，无需手动刷新
                } else {
                    const errMsg = data.message || data.errorMsg || data.msg || data.data?.message || `HTTP ${res.status}`;
                    log('error', `订单提交失败: ${errMsg}`);
                    alert('订单提交失败: ' + errMsg);
                }
            } catch (err) {
                log('error', '下单异常: ' + err.message);
                alert('网络错误: ' + err.message);
            }
        }

        // ==================== WebSocket ====================
        function connectWebSockets() {
            // 公有推送无需登录
            connectPublicWS();
            // 私有推送需要 token
            connectPrivateWS();
        }

        function connectPublicWS() {
            if (publicReconnectTimer) {
                clearTimeout(publicReconnectTimer);
                publicReconnectTimer = null;
            }
            if (state.publicWs && (state.publicWs.readyState === WebSocket.OPEN || state.publicWs.readyState === WebSocket.CONNECTING)) {
                state.publicWs.__intentionalClose = true;
                state.publicWs.close(1000, 'reconnect');
            }
            
            updateWsStatus('public', 'connecting');
            log('info', '正在连接公有推送...');
            
            try {
                const ws = new WebSocket(CONFIG.PUBLIC_PUSH_WS);
                ws.__intentionalClose = false;
                state.publicWs = ws;
                
                ws.onopen = () => {
                    // 旧连接回调直接忽略，避免覆盖当前状态
                    if (ws !== state.publicWs) return;
                    updateWsStatus('public', 'connected');
                    log('success', '公有推送已连接');
                    
                    // 订阅行情数据（订阅成功后会自动收到快照数据）
                    const klineChannel = `kline.BTCUSDT.${currentKlineInterval}`;
                    subscribePublic(['trade.BTCUSDT', 'depth.BTCUSDT', klineChannel]);
                    log('info', `已订阅: trade.BTCUSDT, depth.BTCUSDT, ${klineChannel}`);
                    log('info', '等待服务器推送快照数据...');
                };
                
                ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        log('debug', '收到 WebSocket 消息: ' + JSON.stringify(msg).substring(0, 200));
                        handlePublicMessage(msg);
                    } catch (err) {
                        log('error', '解析 WebSocket 消息失败: ' + err.message + ', data: ' + e.data.substring(0, 200));
                    }
                };
                
                ws.onclose = (event) => {
                    if (ws !== state.publicWs) return;
                    updateWsStatus('public', 'disconnected');
                    log('warn', `公有推送已断开 (代码: ${event.code})`);
                    if (!ws.__intentionalClose) {
                        if (!publicReconnectTimer) {
                            publicReconnectTimer = setTimeout(() => {
                                publicReconnectTimer = null;
                                connectPublicWS();
                            }, 5000);
                        }
                    }
                };
                
                ws.onerror = (err) => {
                    log('error', '公有推送错误: ' + (err.message || 'WebSocket 连接失败，请检查服务是否运行 (public-push-core:8096)'));
                };
            } catch (err) {
                log('error', '公有推送连接失败: ' + err.message);
            }
        }

        function connectPrivateWS() {
            // 检查 token 是否存在
            if (!isLikelyJwt(state.token)) {
                log('warn', '未登录，跳过私有推送连接');
                updateWsStatus('private', 'disconnected');
                localStorage.removeItem('token');
                state.token = null;
                return;
            }
            
            if (privateReconnectTimer) {
                clearTimeout(privateReconnectTimer);
                privateReconnectTimer = null;
            }
            if (state.privateWs && (state.privateWs.readyState === WebSocket.OPEN || state.privateWs.readyState === WebSocket.CONNECTING)) {
                state.privateWs.__intentionalClose = true;
                state.privateWs.close(1000, 'reconnect');
            }
            
            updateWsStatus('private', 'connecting');
            log('info', '正在连接私有推送...');
            
            try {
                // 通过 query 参数传递 token
                const wsUrl = `${CONFIG.PRIVATE_PUSH_WS}?token=${encodeURIComponent(state.token)}`;
                log('info', `WebSocket URL: ${wsUrl.replace(state.token, '***')}`);
                const ws = new WebSocket(wsUrl);
                ws.__intentionalClose = false;
                state.privateWs = ws;
                
                ws.onopen = () => {
                    if (ws !== state.privateWs) return;
                    updateWsStatus('private', 'connected');
                    log('success', '私有推送已连接');
                    
                    // 订阅私有频道
                    subscribePrivate(['executionReport', 'account', 'position']);
                    // 刷新后私有连接建立时主动同步一次账户与持仓
                    refreshBalance();
                    loadPositions();
                };
                
                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    handlePrivateMessage(msg);
                };
                
                ws.onclose = (event) => {
                    if (ws !== state.privateWs) return;
                    updateWsStatus('private', 'disconnected');
                    if (event.code === 1006) {
                        log('error', `私有推送异常断开 (代码: ${event.code})`);
                    } else {
                        log('warn', `私有推送已断开 (代码: ${event.code}, 原因: ${event.reason || '未知'})`);
                    }
                    // 检查是否需要重连
                    if (state.token && !ws.__intentionalClose) {
                        if (!privateReconnectTimer) {
                            privateReconnectTimer = setTimeout(() => {
                                privateReconnectTimer = null;
                                connectPrivateWS();
                            }, 5000);
                        }
                    }
                };
                
                ws.onerror = (err) => {
                    log('error', '私有推送错误: ' + (err.message || 'WebSocket 连接失败，请检查服务是否运行'));
                };
            } catch (err) {
                log('error', '私有推送连接失败: ' + err.message);
            }
        }

        function subscribePublic(channels) {
            if (state.publicWs && state.publicWs.readyState === WebSocket.OPEN) {
                state.publicWs.send(JSON.stringify({
                    method: 'SUBSCRIBE',
                    params: channels,
                    id: Date.now()
                }));
                log('info', '订阅公有频道: ' + channels.join(', '));
            }
        }

        function subscribePrivate(channels) {
            if (state.privateWs && state.privateWs.readyState === WebSocket.OPEN) {
                state.privateWs.send(JSON.stringify({
                    method: 'SUBSCRIBE',
                    params: channels,
                    id: Date.now()
                }));
                log('info', '订阅私有频道: ' + channels.join(', '));
            }
        }

        function handlePublicMessage(msg) {
            // 心跳响应
            if (msg.pong) {
                return;
            }
            // 服务端心跳（避免 public-push-core 判定 zombie 断连）
            if (msg.ping && state.publicWs && state.publicWs.readyState === WebSocket.OPEN) {
                state.publicWs.send(JSON.stringify({ pong: msg.ping }));
                return;
            }
            
            // 处理批量消息格式（batch: true）
            if (msg.batch === true && Array.isArray(msg.messages)) {
                log('debug', `收到批量消息，包含 ${msg.messages.length} 条`);
                msg.messages.forEach((messageStr, idx) => {
                    try {
                        // 批量消息中的每个元素是 JSON 字符串，需要解析
                        const innerMsg = typeof messageStr === 'string' ? JSON.parse(messageStr) : messageStr;
                        log('debug', `处理批量消息 ${idx}: stream=${innerMsg.stream}`);
                        handlePublicMessage(innerMsg);
                    } catch (err) {
                        log('error', '解析批量消息失败: ' + err.message);
                    }
                });
                return;
            }
            
            // 连接确认
            if (msg.result === 'connected') {
                return;
            }

            // 订阅确认
            if (msg.result === 'subscribed') {
                const subscribed = msg.data?.subscribed || msg.data || [];
                log('success', `订阅成功: ${JSON.stringify(subscribed)}`);
                // 订阅成功后，服务器会自动发送快照数据（snapshot: true）
                if (subscribed.includes('depth.BTCUSDT')) {
                    log('info', '深度频道订阅成功，等待服务器推送快照数据...');
                }
                return;
            }

            // 退订确认
            if (msg.result === 'unsubscribed') {
                const unsubscribed = msg.data || [];
                log('success', `退订成功: ${JSON.stringify(unsubscribed)}`);
                return;
            }
            
            // 处理快照数据（首次订阅时服务器会发送）
            if (msg.snapshot === true || msg.data?.snapshot === true) {
                const channel = msg.stream || msg.e;
                // 修复: 使用 includes 而不是 startsWith，更宽松的匹配
                if (channel && (channel.includes('depth') || channel.includes('DEPTH'))) {
                    log('success', '收到深度快照数据');
                    const depthData = msg.data || msg;
                    wsOrderBookData = {
                        bids: depthData.b || depthData.bids || [],
                        asks: depthData.a || depthData.asks || [],
                        timestamp: depthData.E || msg.E || Date.now()
                    };
                    lastOrderBookUpdate = Date.now();
                    currentOrderBook = wsOrderBookData;
                    updateOrderBookDisplay(wsOrderBookData);
                } else if (channel && (channel.includes('trade') || channel.includes('TRADE'))) {
                    log('success', '收到成交快照数据');
                    const tradeSnapshot = msg.data || msg;
                    if (Array.isArray(tradeSnapshot)) {
                        updateTrades(tradeSnapshot);
                    } else if (Array.isArray(tradeSnapshot.trades)) {
                        updateTrades(tradeSnapshot.trades);
                    } else {
                        updateTrades(tradeSnapshot);
                    }
                }
                return;
            }
            
            // 处理不同频道数据
            let channel = msg.stream || msg.e;
            
            // 修复: 如果没有 channel，尝试从 data 中获取
            if (!channel && msg.data) {
                channel = msg.data.stream || msg.data.e;
            }
            
            if (!channel) {
                // 如果没有 channel，检查是否是深度数据（通过字段判断）
                const data = msg.data || msg;
                if (data && (data.b || data.a || data.bids || data.asks)) {
                    log('debug', '收到无频道标识的深度数据，尝试解析...');
                    handleDepthUpdate(data, 'unknown');
                } else {
                    log('warn', '收到无频道标识的消息: ' + JSON.stringify(msg).substring(0, 200));
                }
                return;
            }
            
            log('debug', `处理频道数据: channel=${channel}, hasData=${!!msg.data}`);
            
            // 修复: 更宽松的频道匹配
            if (channel.includes('trade') || channel.includes('TRADE')) {
                const tradeData = msg.data || msg;
                log('info', `收到成交数据: channel=${channel}, p=${tradeData.p}, q=${tradeData.q}, m=${tradeData.m}`);
                updateTrades(tradeData);
            } else if (channel.includes('depth') || channel.includes('DEPTH') || channel.includes('Depth')) {
                // WebSocket 深度数据更新
                handleDepthUpdate(msg.data || msg, channel);
            } else if (channel.includes('kline') || channel.includes('KLINE') || channel.includes('KLine')) {
                updateKline(msg.data || msg);
            } else {
                log('warn', `未知频道: ${channel}`);
            }
        }
        
        // 新增: 统一的深度数据更新处理函数
        function handleDepthUpdate(depthData, channel) {
            if (!depthData) {
                log('warn', '深度数据为空');
                return;
            }

            const updateId = normalizeRawNumber(depthData.u ?? depthData.lastUpdateId ?? depthData.updateId);
            const eventTs = normalizeRawNumber(depthData.E ?? depthData.T ?? Date.now());
            if (wsOrderBookData) {
                const prevUpdateId = normalizeRawNumber(wsOrderBookData.updateId);
                const prevTs = normalizeRawNumber(wsOrderBookData.timestamp);
                // 忽略乱序旧消息，避免成交后盘口回跳
                if (Number.isFinite(updateId) && Number.isFinite(prevUpdateId) && updateId < prevUpdateId) {
                    return;
                }
                if (Number.isFinite(eventTs) && Number.isFinite(prevTs) && eventTs < prevTs) {
                    return;
                }
            }
            
            // 支持多种字段名
            let bids = depthData.b || depthData.bids || depthData.B || [];
            let asks = depthData.a || depthData.asks || depthData.A || [];
            
            // 处理数据格式转换
            const normalizeItem = (item) => {
                if (Array.isArray(item)) {
                    return [item[0], item[1]];
                }
                if (typeof item === 'object' && item !== null) {
                    return [
                        item.price ?? item.p ?? item.askPrice ?? item.bidPrice,
                        item.qty ?? item.q ?? item.quantity ?? item.size ?? item.volume ?? item.askQty ?? item.bidQty
                    ];
                }
                return item;
            };
            
            bids = bids.map(normalizeItem);
            asks = asks.map(normalizeItem);
            
            wsOrderBookData = {
                bids: bids,
                asks: asks,
                timestamp: Number.isFinite(eventTs) ? eventTs : Date.now(),
                updateId: Number.isFinite(updateId) ? updateId : undefined
            };
            lastOrderBookUpdate = Date.now();
            
            log('info', `📊 深度更新: channel=${channel}, bids=${bids.length}, asks=${asks.length}`);
            
            // 调试信息
            if (bids.length > 0) {
                const bPrice = normalizePriceNumber(bids[0][0]);
                const bQty = normalizeQtyNumber(bids[0][1]);
                log('debug', `买一: rawPrice=${bids[0][0]}, rawQty=${bids[0][1]}, normPrice=${bPrice}, normQty=${bQty}`);
            }
            if (asks.length > 0) {
                const aPrice = normalizePriceNumber(asks[0][0]);
                const aQty = normalizeQtyNumber(asks[0][1]);
                log('debug', `卖一: rawPrice=${asks[0][0]}, rawQty=${asks[0][1]}, normPrice=${aPrice}, normQty=${aQty}`);
            }
            
            updateOrderBookDisplay(wsOrderBookData);
            currentOrderBook = wsOrderBookData;
        }

        function handlePrivateMessage(msg) {
            // ACK 消息序号，避免服务端重复重发同一执行报告
            const seq = msg.seq ?? msg.data?.seq;
            if (seq !== undefined && seq !== null) {
                sendPrivateAck(seq);
            }

            // 连接确认
            if (msg.e === 'connectionAck') {
                log('success', `私有连接确认, userId: ${msg.userId}`);
                return;
            }
            
            // 订阅确认
            if (msg.result === null && msg.id) {
                log('success', '私有订阅确认');
                return;
            }
            
            // 账户更新
            if (msg.e === 'outboundAccountPosition') {
                log('info', '账户余额更新');
                refreshBalance();
                return;
            }
            
            // 订单更新 (executionReport)
            // 支持两种格式: {e: 'executionReport', ...} 或 {stream: 'executionReport', data: {e: 'executionReport', ...}}
            if (msg.e === 'executionReport' || 
                (msg.data && msg.data.e === 'executionReport') ||
                msg.stream === 'executionReport') {
                const data = msg.data || msg;
                log('info', `📥 收到 executionReport: ${JSON.stringify(data).substring(0, 200)}`);
                handleExecutionReport(data);
                return;
            }
            
            // 持仓更新 (position)
            if (msg.e === 'position' || (msg.data && msg.data.e === 'position')) {
                const data = msg.data || msg;
                handlePositionUpdate(data);
                return;
            }
            
            // 其他私有消息
            log('info', '私有消息: ' + JSON.stringify(msg).substring(0, 100));
        }

        function sendPrivateAck(seq) {
            if (!state.privateWs || state.privateWs.readyState !== WebSocket.OPEN) {
                return;
            }
            state.privateWs.send(JSON.stringify({
                method: 'ACK',
                seq: seq
            }));
        }

        // ==================== 数据更新 ====================
        // 成交数据专用格式化函数（数据来自 Kafka，是内部 long 格式）
        function formatTradePrice(price) {
            if (price === null || price === undefined) return '0.00';
            const num = normalizePriceNumber(price);
            if (!isFinite(num)) return '0.00';
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        function formatTradeQty(qty) {
            if (qty === null || qty === undefined) return '0.00';
            const num = normalizeQtyNumber(qty);
            if (!isFinite(num)) return '0.00';
            return num.toFixed(2);
        }

        function updateTrades(data) {
            log('info', `updateTrades called with: ${JSON.stringify(data).substring(0, 100)}`);
            
            if (!data) {
                log('warn', 'updateTrades: data is null');
                return;
            }
            
            // 修复：支持单个对象或数组
            const trades = Array.isArray(data) ? data : [data];
            log('info', `updateTrades: ${trades.length} trades to display`);
            
            if (trades.length === 0) {
                log('warn', 'updateTrades: no trades');
                return;
            }
            
            const list = document.getElementById('tradeList');
            if (!list) {
                log('error', 'updateTrades: tradeList element not found!');
                return;
            }
            
            // 获取现有的 trades（如果存在）
            let existingHtml = list.innerHTML;
            if (existingHtml.includes('等待数据...')) {
                existingHtml = '';
            }
            
            // 添加新的 trades 到顶部
            let newHtml = '';
            trades.slice(0, 20).forEach((trade, idx) => {
                const isBuy = trade.m; // m = isBuyerMaker
                const side = isBuy ? 'sell' : 'buy';
                const sideText = isBuy ? '卖出' : '买入';
                
                log('debug', `Trade ${idx}: p=${trade.p}, q=${trade.q}, m=${trade.m}, side=${side}`);
                
                newHtml += `
                    <div class="trade-item">
                        <span class="trade-${side}">${sideText}</span>
                        <span class="trade-price">${formatTradePrice(trade.p)}</span>
                        <span>${formatTradeQty(trade.q)}</span>
                    </div>
                `;
            });
            
            // 将新数据放在顶部，保留最多 50 条
            list.innerHTML = newHtml + existingHtml;
            log('info', `updateTrades: DOM updated, list now has ${list.querySelectorAll('.trade-item').length} items`);
            
            // 限制显示数量
            const items = list.querySelectorAll('.trade-item');
            if (items.length > 50) {
                for (let i = 50; i < items.length; i++) {
                    items[i].remove();
                }
            }
        }

        // 从 WebSocket 更新订单簿 (外部数据)
        function updateOrderBook(data) {
            if (!data) return;
            
            // 卖单 (Asks) - 红色，倒序显示
            if (data.asks) {
                const asks = data.asks.slice(0, 8).reverse();
                let asksHtml = '';
                asks.forEach(([price, qty]) => {
                    asksHtml += `
                        <div class="orderbook-row orderbook-ask">
                            <span>${formatPrice(price)}</span>
                            <span>${formatQty(qty)}</span>
                            <span>--</span>
                        </div>
                    `;
                });
                document.getElementById('orderbookAsks').innerHTML = asksHtml;
            }
            
            // 买单 (Bids) - 绿色
            if (data.bids) {
                const bids = data.bids.slice(0, 8);
                let bidsHtml = '';
                bids.forEach(([price, qty]) => {
                    bidsHtml += `
                        <div class="orderbook-row orderbook-bid">
                            <span>${formatPrice(price)}</span>
                            <span>${formatQty(qty)}</span>
                            <span>--</span>
                        </div>
                    `;
                });
                document.getElementById('orderbookBids').innerHTML = bidsHtml;
            }

        function escapeForSingleQuotedAttr(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }

        function normalizeOrderStatus(status) {
            if (status === null || status === undefined) {
                return '';
            }
            if (typeof status === 'number') {
                return status;
            }
            const raw = String(status).trim();
            if (/^-?\d+$/.test(raw)) {
                return Number(raw);
            }
            return raw.toUpperCase();
        }

        function isOrderCancelable(status) {
            const normalized = normalizeOrderStatus(status);
            return normalized === 'NEW' ||
                normalized === 'PENDING_RISK' ||
                normalized === 'FROZEN' ||
                normalized === 'PARTIALLY_FILLED' ||
                normalized === 0 ||
                normalized === 1 ||
                normalized === 2 ||
                normalized === 3;
        }

        async function cancelOrder(orderId, symbol) {
            const normalizedOrderId = String(orderId || '').trim();
            if (!normalizedOrderId) {
                alert('订单号无效，无法撤销');
                return;
            }

            if (!isLikelyJwt(state.token)) {
                alert('登录已失效，请重新登录');
                return;
            }

            if (cancelingOrderIds.has(normalizedOrderId)) {
                return;
            }

            if (!confirm(`确认撤销订单 ${normalizedOrderId} 吗？`)) {
                return;
            }

            cancelingOrderIds.add(normalizedOrderId);

            const payload = {
                orderId: normalizedOrderId
            };
            if (state.userId && !Number.isNaN(Number(state.userId))) {
                payload.userId = Number(state.userId);
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${state.token}`,
                'X-Trace-Id': `web_trace_${Date.now()}`,
                'X-Request-Id': `web_req_${Date.now()}`,
                'X-Idempotency-Key': `cancel_${normalizedOrderId}_${Date.now()}`
            };
            if (state.userId) {
                headers['X-User-Id'] = String(state.userId);
            }

            const cancelUrls = [
                `${CONFIG.API_GATEWAY}/api/order/cancel`,
                `${CONFIG.API_GATEWAY}/api/v1/oms/order/cancel`
            ];

            let lastError = '';
            let success = false;
            for (const url of cancelUrls) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json().catch(() => ({}));
                    const wrapped = data.data || {};
                    const code = Number(data.code ?? wrapped.code ?? data.status);
                    const statusText = String(data.status || wrapped.status || '').toUpperCase();
                    const apiSuccess = res.ok && (
                        data.success === true ||
                        wrapped.success === true ||
                        code === 0 ||
                        code === 200 ||
                        data.code === 'SUCCESS' ||
                        statusText === 'OK' ||
                        statusText === 'CANCELED'
                    );

                    if (apiSuccess) {
                        success = true;
                        const cached = orderCache.get(normalizedOrderId);
                        if (cached) {
                            cached.status = 'CANCELED';
                        }
                        userPendingOrders.delete(normalizedOrderId);
                        log('success', `撤单成功: orderId=${normalizedOrderId}`);
                        refreshBalance();
                        loadOrders(state.currentOrderFilter);
                        setTimeout(() => loadOrders(state.currentOrderFilter), 300);
                        break;
                    }

                    const errMsg = data.errorMessage || data.message || data.msg ||
                        wrapped.errorMessage || wrapped.message || `HTTP ${res.status}`;
                    lastError = `${url} -> ${errMsg}`;
                } catch (err) {
                    lastError = `${url} -> ${err.message}`;
                }
            }

            if (!success) {
                log('error', `撤单失败: ${lastError}`);
                alert(`撤单失败: ${lastError}`);
            }

            cancelingOrderIds.delete(normalizedOrderId);
            if (state.currentBottomTab === 'orders') {
                loadOrders(state.currentOrderFilter);
            }
        }
        
        function getStatusClass(status) {
            // 支持字符串和数字状态码
            const statusMap = {
                // 字符串状态
                'NEW': 'status-new', 'PENDING_RISK': 'status-new', 'FROZEN': 'status-new',
                'PARTIALLY_FILLED': 'status-partial',
                'FILLED': 'status-filled',
                'CANCELED': 'status-cancelled', 'REJECTED': 'status-cancelled',
                // 数字状态 (0=NEW, 1=PENDING_RISK, 2=FROZEN, 3=PARTIALLY_FILLED, 4=FILLED, 5=CANCELED, 6=REJECTED)
                0: 'status-new', 1: 'status-new', 2: 'status-new',
                3: 'status-partial',
                4: 'status-filled',
                5: 'status-cancelled', 6: 'status-cancelled'
            };
            return statusMap[status] || 'status-new';
        }
        
        function getStatusText(status) {
            // 支持字符串和数字状态码
            const statusMap = {
                // 字符串状态
                'NEW': '新建', 'PENDING_RISK': '风控中', 'FROZEN': '已冻结',
                'PARTIALLY_FILLED': '部分成交',

                3: '部分成交',
                4: '完全成交',
                5: '已撤销', 6: '已拒绝'
            };
            return statusMap[status] || (status !== undefined ? String(status) : '未知');
        }

        // ==================== WebSocket 消息处理增强 ====================
        function handleExecutionReport(msg) {
            const orderId = String(msg.i ?? msg.orderId ?? '');
            const statusRaw = msg.X ?? msg.x ?? msg.status ?? 'UNKNOWN';
            const status = String(statusRaw).toUpperCase();
            const execTypeRaw = msg.x ?? msg.executionType ?? msg.eventType ?? '';
            const execType = String(execTypeRaw).toUpperCase();
            const filledQuantity = msg.z ?? msg.Z ?? msg.cumQty ?? msg.filledQuantity ?? '0';
            const lastFilledQty = msg.l ?? msg.lastFilledQty ?? msg.tradeQty ?? '0';
            const quantity = msg.q ?? msg.Q ?? msg.origQty ?? msg.quantity ?? '0';
            const symbol = msg.s ?? msg.S ?? msg.symbol ?? '';
            const side = msg.side ?? msg.SIDE ?? msg.S ?? '';
            const price = msg.p ?? msg.P ?? msg.price ?? '';
            const createTime = msg.T ?? msg.E ?? Date.now();

            log('info', `📨 订单执行报告: orderId=${orderId}, status=${status}, filled=${filledQuantity}/${quantity}`);
            
            // 更新订单缓存
            const existingOrder = orderCache.get(orderId);
            
            if (existingOrder) {
                existingOrder.status = status;
                existingOrder.filledQuantity = filledQuantity; // 累计已成交
                log('info', `📝 更新订单缓存: ${orderId} -> ${status}`);
            } else {
                // 新订单，添加到缓存
                orderCache.set(orderId, {
                    orderId: orderId,
                    symbol: symbol,
                    side: side,
                    price: price,
                    quantity: quantity,
                    filledQuantity: filledQuantity,
                    status: status,
                    createTime: createTime
                });
                log('info', `📝 新增订单缓存: ${orderId} -> ${status}`);
            }

            if (status === 'CANCELED' || status === 'FILLED' || status === 'REJECTED') {
                userPendingOrders.delete(orderId);
            }
            
            // 🔥 修复：收到成交报告后，强制刷新订单列表（无论当前在哪个Tab）
            // 因为订单状态可能从 active 变为 history
            if (state.currentBottomTab === 'orders') {
                log('info', `🔄 刷新订单列表 (当前filter: ${state.currentOrderFilter})`);
                loadOrders(state.currentOrderFilter);
                
                // 如果订单已成交或撤销，同时刷新另一个Tab（可能订单状态已变更）
                if (status === 'FILLED' || status === 'CANCELED' || status === 'REJECTED') {
                    // 延迟刷新，确保后端数据已更新
                    setTimeout(() => {
                        log('info', `🔄 订单${status}，重新加载当前Tab`);
                        loadOrders(state.currentOrderFilter);
                    }, 300);
                }
            }
            
            // 如果完全成交或撤销，刷新余额和持仓
            if (status === 'FILLED' || status === 'CANCELED') {
                setTimeout(() => {
                    refreshBalance();
                    // 刷新持仓（成交后持仓会变化）
                    if (status === 'FILLED') {
                        triggerPositionRefresh(`order ${orderId} FILLED`);
                    }
                }, 500);
            }


            const hasTradeDelta = Number(lastFilledQty) > 0;
            const isTradeExec = execType === 'TRADE' || execType === 'FILLED' || execType === 'PARTIALLY_FILLED';
            const isTradeStatus = status === 'FILLED' || status === 'PARTIALLY_FILLED';
            if (hasTradeDelta || isTradeExec || isTradeStatus) {
                triggerPositionRefresh(`executionReport trade event: order=${orderId}, execType=${execType}, status=${status}`);
            }
        }

        }
