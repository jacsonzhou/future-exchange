                        <div style="display:flex;flex-direction:column;gap:4px;">
                            ${userOrders.map(order => `
                                <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
                                    <span style="color:${order.side === 'BUY' ? '#3fb950' : '#f85149'}">
                                        ${order.side === 'BUY' ? '买入' : '卖出'} @ ${formatPrice(order.price)}
                                    </span>
                                    <span style="color:#8b949e">${formatQty(order.quantity)} BTC</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = `
                <div style="width:100%;padding:20px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                        <div style="text-align:left">
                            <div style="font-size:32px;font-weight:600;color:${currentPrice >= 50000 ? '#3fb950' : '#f85149'}">
                                ${formatPrice(currentPrice)}
                            </div>
                            <div style="font-size:12px;color:#8b949e;margin-top:4px;">USDT</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-size:12px;color:#8b949e;">买一</div>
                            <div style="color:#3fb950;font-weight:600;">${currentOrderBook.bids[0] ? formatPrice(currentOrderBook.bids[0][0]) : '--'}</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-size:12px;color:#8b949e;">卖一</div>
                            <div style="color:#f85149;font-weight:600;">${currentOrderBook.asks[0] ? formatPrice(currentOrderBook.asks[0][0]) : '--'}</div>
                        </div>
                    </div>
                    
                    <!-- 简单的价格走势模拟 -->
                    <div style="height:200px;background:#0d1117;border-radius:8px;position:relative;overflow:hidden;margin-bottom:15px;">
                        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;">
                            <defs>
                                <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:#238636;stop-opacity:0.3" />
                                    <stop offset="100%" style="stop-color:#238636;stop-opacity:0" />
                                </linearGradient>
                            </defs>
                            <path d="M0,80 Q20,70 40,75 T80,60 T100,50" 
                                  fill="none" 
                                  stroke="#238636" 
                                  stroke-width="0.5"/>
                            <path d="M0,80 Q20,70 40,75 T80,60 T100,50 L100,100 L0,100 Z" 
                                  fill="url(#chartGradient)"/>
                        </svg>
                        
                        <!-- 在当前价格位置显示标记 -->
                        <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#30363d;opacity:0.5;"></div>
                        <div style="position:absolute;right:10px;top:48%;font-size:10px;color:#8b949e;">当前价</div>
                        
                        <!-- 用户挂单标记 -->
                        ${userOrders.map(order => {
                            const pct = Math.max(0, Math.min(100, 100 - ((order.price - currentPrice * 0.95) / (currentPrice * 0.1)) * 100));
                            const color = order.side === 'BUY' ? '#3fb950' : '#f85149';
                            return `<div style="position:absolute;left:0;right:0;top:${pct}%;height:2px;background:${color};opacity:0.8;">
                                <div style="position:absolute;right:5px;top:-8px;font-size:9px;color:${color};">${order.side === 'BUY' ? '买' : '卖'} ${formatPrice(order.price)}</div>
                            </div>`;
                        }).join('')}
                    </div>
                    
                    ${ordersHtml}
                    
                    <div style="text-align:center;color:#8b949e;font-size:12px;margin-top:15px;">
                        数据每2秒自动刷新 | 挂单实时同步
                    </div>
                </div>
            `;
        }
        
        // ==================== K线图表函数 ====================
        
        function initKlineChart() {
            const chartContainer = document.getElementById('klineChart');
            if (!chartContainer) return;
            
            // 如果已经有图表，先移除
            if (klineChart) {
                klineChart.remove();
            }
            
            klineChart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    background: { color: '#0d1117' },
                    textColor: '#8b949e',
                },
                grid: {
                    vertLines: { color: '#161b22' },
                    horzLines: { color: '#161b22' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        color: '#58a6ff',
                        labelBackgroundColor: '#58a6ff',
                    },
                    horzLine: {
                        color: '#58a6ff',
                        labelBackgroundColor: '#58a6ff',
                    },
                },
                rightPriceScale: {
                    borderColor: '#30363d',
                },
                timeScale: {
                    borderColor: '#30363d',
                    timeVisible: true,
                    secondsVisible: false,
                },
                handleScroll: {
                    vertTouchDrag: false,
                },
            });

            // 创建K线系列
            klineSeries = klineChart.addCandlestickSeries({
                upColor: '#3fb950',
                downColor: '#f85149',
                borderUpColor: '#3fb950',
                borderDownColor: '#f85149',
                wickUpColor: '#3fb950',
                wickDownColor: '#f85149',
            });

            // 创建成交量系列
            klineVolumeSeries = klineChart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: {
                    type: 'volume',
                },
                priceScaleId: '',
                scaleMargins: {
                    top: 0.85,
                    bottom: 0,
                },
            });

            // 自适应大小
            const resizeObserver = new ResizeObserver(entries => {
                if (!klineChart || entries.length === 0) return;
                const newRect = entries[0].contentRect;
                klineChart.applyOptions({ width: newRect.width, height: newRect.height });
            });
            resizeObserver.observe(chartContainer);
            
            // 生成初始数据
            generateInitialKlineData();
            
            log('success', 'K线图表初始化完成');
        }
        
        function toKlineTimeSeconds(value) {
            const raw = normalizeRawNumber(value);
            if (!Number.isFinite(raw)) {
                return NaN;
            }
            return Math.floor(raw >= 1_000_000_000_000 ? raw / 1000 : raw);
        }

        function toKlinePriceNumber(value) {
            const num = normalizePriceNumber(value);
            return Number.isFinite(num) ? num : NaN;
        }

        function toKlineVolumeNumber(value) {
            const num = normalizeQtyNumber(value);
            return Number.isFinite(num) ? num : NaN;
        }

        // 从 API Gateway 获取真实历史K线数据
        async function fetchHistoricalKlines() {
            const symbol = document.getElementById('symbol')?.value || 'BTCUSDT';
            const interval = currentKlineInterval;
            const fetchSeq = ++klineFetchSeq;
            
            log('info', `正在加载 ${symbol} ${interval} 历史K线数据...`);
            
            try {
                // 通过 API Gateway 获取K线数据 (网关路由路径)
                const response = await fetch(
                    `${CONFIG.API_GATEWAY}/api/v1/klines?symbol=${symbol}&interval=${interval}&limit=200`
                );

                // 周期切换后忽略旧请求
                if (fetchSeq !== klineFetchSeq || interval !== currentKlineInterval) {
                    return;
                }
                
                if (!response.ok) {
                    // API可能还没准备好，显示空图表
                    console.warn(`K线API返回 ${response.status}，等待WebSocket实时数据...`);
                    showEmptyKlineChart();
                    return;
                }
                
                const result = await response.json();
                
                if (result.code !== 0 && result.code !== 200) {
                    throw new Error(result.message || '获取K线数据失败');
                }
                
                const klines = Array.isArray(result.data) ? result.data : [];
                
                if (klines.length === 0) {
                    log('warn', '暂无历史K线数据，等待实时成交生成...');
                    showEmptyKlineChart();
                    return;
                }
                
                // 转换并排序（图表要求按时间升序，且数值字段必须是 number）
                const rows = [];
                klines.forEach(k => {
                    const openTime = toKlineTimeSeconds(Array.isArray(k) ? k[0] : (k.openTime ?? k.t ?? k.time));
                    const open = toKlinePriceNumber(Array.isArray(k) ? k[1] : (k.open ?? k.o));
                    const high = toKlinePriceNumber(Array.isArray(k) ? k[2] : (k.high ?? k.h));
                    const low = toKlinePriceNumber(Array.isArray(k) ? k[3] : (k.low ?? k.l));
                    const close = toKlinePriceNumber(Array.isArray(k) ? k[4] : (k.close ?? k.c));
                    const volume = toKlineVolumeNumber(Array.isArray(k) ? k[5] : (k.volume ?? k.v));
                    if (!Number.isFinite(openTime) || !Number.isFinite(open) || !Number.isFinite(high) ||
                        !Number.isFinite(low) || !Number.isFinite(close) || !Number.isFinite(volume)) {
                        return;
                    }
                    rows.push({ time: openTime, open, high, low, close, volume });
                });

                if (rows.length === 0) {
                    log('warn', '历史K线数据格式异常，等待实时成交生成...');
                    showEmptyKlineChart();
                    return;
                }

                rows.sort((a, b) => a.time - b.time);

                const candleData = rows.map(item => ({
                    time: item.time,
                    open: item.open,
                    high: item.high,
                    low: item.low,
                    close: item.close
                }));
                const volumeData = rows.map(item => ({
                    time: item.time,
                    value: item.volume,
                    color: item.close >= item.open ? 'rgba(63, 185, 80, 0.5)' : 'rgba(248, 81, 73, 0.5)'
                }));
                
                // 设置数据
                klineSeries.setData(candleData);
                klineVolumeSeries.setData(volumeData);
                klineDataMap.set(interval, candleData);
                
                // 更新当前价格
                const lastCandle = candleData[candleData.length - 1];
                lastKlineTimeMap.set(interval, lastCandle.time);
                lastKlinePrice = lastCandle.close;
                updateKlinePriceDisplay(lastCandle.close, lastCandle.close);
                
                log('success', `已加载 ${candleData.length} 根真实K线数据`);
                
            } catch (err) {
                // 周期切换导致的旧请求报错直接忽略
                if (fetchSeq !== klineFetchSeq || interval !== currentKlineInterval) {
                    return;
                }
                log('warn', `历史K线暂未就绪: ${err.message}，等待WebSocket实时数据...`);
                showEmptyKlineChart();
            }
        }
        
        // 显示空K线图表（等待实时数据）
        function showEmptyKlineChart() {
            if (klineSeries) {
                klineSeries.setData([]);
            }
            if (klineVolumeSeries) {
                klineVolumeSeries.setData([]);
            }
            lastKlineTimeMap.set(currentKlineInterval, 0);
            // 显示当前价格（从盘口获取）
            const price = currentOrderBook.bids[0] ? 
                parseFloat(currentOrderBook.bids[0][0]) / 1e8 : 0;
            if (price > 0) {
                updateKlinePriceDisplay(price, price);
            }
        }
        
        // 兼容旧函数名
        function generateInitialKlineData() {
            fetchHistoricalKlines();
        }
        
        function updateKline(data) {
            if (!data || !data.k || !klineSeries || !klineVolumeSeries) return;
            
            const k = data.k;
            
            // 只处理当前周期的K线
            if (k.i !== currentKlineInterval) return;

            const candleTime = toKlineTimeSeconds(k.t ?? k.openTime ?? k.time);
            const open = toKlinePriceNumber(k.o ?? k.open);
            const high = toKlinePriceNumber(k.h ?? k.high);
            const low = toKlinePriceNumber(k.l ?? k.low);
            const close = toKlinePriceNumber(k.c ?? k.close);
            const volumeValue = toKlineVolumeNumber(k.v ?? k.volume);
            if (!Number.isFinite(candleTime) || !Number.isFinite(open) || !Number.isFinite(high) ||
                !Number.isFinite(low) || !Number.isFinite(close) || !Number.isFinite(volumeValue)) {
                return;
            }

            const lastTime = lastKlineTimeMap.get(k.i) || 0;
            if (lastTime > 0 && candleTime < lastTime) {
                // 忽略旧桶，避免 LightweightCharts 抛出 oldest data 错误
                return;
            }
            
            const candle = {
                time: candleTime,
                open: open,
                high: high,
                low: low,
                close: close
            };
            
            const volume = {
                time: candleTime,
                value: volumeValue,
                color: close >= open ? 'rgba(63, 185, 80, 0.5)' : 'rgba(248, 81, 73, 0.5)'
            };
            
            // 更新图表
            try {
                klineSeries.update(candle);
                klineVolumeSeries.update(volume);
            } catch (err) {
                log('warn', `K线更新忽略: ${err.message}`);
                return;
            }
            
            lastKlineTimeMap.set(k.i, candleTime);

            // 更新当前价格显示
            updateKlinePriceDisplay(candle.close, lastKlinePrice || candle.open);
            lastKlinePrice = candle.close;
        }
        
        function updateKlinePriceDisplay(price, lastPrice) {
            const el = document.getElementById('klineCurrentPrice');
            if (!el) return;
            
            el.textContent = price.toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });
            
            if (price > lastPrice) {
                el.className = 'kline-price up';
            } else if (price < lastPrice) {
                el.className = 'kline-price down';
            }
        }
        
        function changeKlineInterval(interval) {
            const previousInterval = currentKlineInterval;
            
            // 更新按钮状态
            document.querySelectorAll('.kline-interval-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.interval === interval);
            });

            if (!interval || interval === previousInterval) {
                return;
            }
            
            currentKlineInterval = interval;
            
            // 重新订阅
            if (state.publicWs && state.publicWs.readyState === WebSocket.OPEN) {
                // 取消旧订阅（必须先记录旧周期，否则会退订到新周期）
                if (previousInterval) {
                    state.publicWs.send(JSON.stringify({
                        method: 'UNSUBSCRIBE',
                        params: [`kline.BTCUSDT.${previousInterval}`],
                        id: Date.now()
                    }));
                }
                // 订阅新周期
                subscribePublic([`kline.BTCUSDT.${interval}`]);
            }
            
            // 重新加载当前周期历史数据
            generateInitialKlineData();
            
            log('info', `切换K线周期: ${interval}`);
        }
        
        function getKlineIntervalMs(interval) {
            const unit = interval.slice(-1);
            const value = parseInt(interval.slice(0, -1));
            const multipliers = { 's': 1000, 'm': 60 * 1000, 'h': 60 * 60 * 1000, 'd': 24 * 60 * 60 * 1000 };
            return value * (multipliers[unit] || 60000);
        }
        
        // 保留旧的挂单显示函数（简化版）
        function updateKlineWithOrders() {
            // 此函数保留兼容性，但不再渲染整个图表
            // 图表现在由TradingView管理
        }

        // ==================== 工具函数 ====================
        function updateWsStatus(type, status) {
            const el = document.getElementById(type + 'WsStatus');
            el.className = 'ws-status ' + status;
            el.textContent = type === 'public' ? '公有推送' : '私有推送';
        }

        function log(level, message) {
            const panel = document.getElementById('logPanel');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const colors = {
                info: 'log-info',
                success: 'log-success',
                error: 'log-error',
                warn: 'log-warn'
            };
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${time}</span> <span class="${colors[level] || 'log-info'}">${message}</span>`;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logPanel').innerHTML = '';
        }

        function reconnectWs() {
            log('info', '手动重连 WebSocket...');
            connectWebSockets();
        }

        function formatMoney(amount) {
            // 系统内部是 8位小数，转换为显示格式
            const num = parseFloat(amount) / 100000000;
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 8 }) + ' USDT';
        }

        function formatMoneyDirect(amount) {
            // snapshot-account-core 返回的是 BigDecimal 格式（如 100000.00 或 0E-16）
            if (amount === null || amount === undefined || amount === '') return '0.00 USDT';
            const num = parseFloat(amount);
            if (isNaN(num)) return '0.00 USDT';
            // 处理科学计数法（如 0E-16）
            const fixed = num.toFixed(2);
            return parseFloat(fixed).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USDT';
        }

        function formatPrice(price, orderType) {
            // 处理市价单
            if (orderType === 'MARKET' || price === null || price === undefined || price === '' || price === '0') {
                return '市价';
            }
            
            let num = normalizePriceNumber(price);
            
            // 检查是否为无效数值
            if (isNaN(num) || num === 0) {
                return orderType === 'MARKET' ? '市价' : '0.00';
            }
            
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatQty(qty) {
            if (qty === null || qty === undefined || qty === '') {
                return '0.00';
            }
            
            let num = normalizeQtyNumber(qty);
            
            // 检查是否为无效数值
            if (isNaN(num)) {
                return '0.00';
            }
            
            return num.toFixed(2);
        }

        function normalizeRawNumber(value) {
            if (value === null || value === undefined || value === '') {
                return NaN;
            }
            const raw = String(value).trim();
            if (!raw) {
                return NaN;
            }
            const num = Number(raw);
            if (!Number.isFinite(num)) {
                return NaN;
            }
            return num;
        }

        function normalizePriceNumber(value) {
            if (value === null || value === undefined || value === '') {
                return NaN;
            }
            const raw = String(value).trim();
            if (!raw) {
                return NaN;
            }
            const num = Number(raw);
            if (!Number.isFinite(num)) {
                return NaN;
            }
            // 若服务端已返回小数字符串（如 60000.00000000），不再二次缩放
            if (raw.includes('.') || raw.includes('e') || raw.includes('E')) {
                return num;
            }
            // 兼容纯整数字符串的 8 位精度 long（如 5000000000000 -> 50000）
            if (Number.isInteger(num) && Math.abs(num) >= 100000000) {
                return num / 100000000;
            }
            return num;
        }

        function normalizeQtyNumber(value) {
            if (value === null || value === undefined || value === '') {
                return NaN;
            }
            const raw = String(value).trim();
            if (!raw) {
                return NaN;
            }
            const num = Number(raw);
            if (!Number.isFinite(num)) {
                return NaN;
            }
            // 若服务端已返回小数字符串（如 1939992.00000000），按原始单位显示
            if (raw.includes('.') || raw.includes('e') || raw.includes('E')) {
                return num;
            }
            // 兼容纯整数字符串的 8 位精度 long（如 100000000 -> 1）
            if (Number.isInteger(num) && Math.abs(num) >= 1000000) {
                return num / 100000000;
            }
            return num;
        }

        // 心跳
        setInterval(() => {
            const now = Date.now();
            if (state.publicWs && state.publicWs.readyState === WebSocket.OPEN) {
                state.publicWs.send(JSON.stringify({ ping: now }));
            }
            if (state.privateWs && state.privateWs.readyState === WebSocket.OPEN) {
                state.privateWs.send(JSON.stringify({ method: 'PING', id: now }));
            }
        }, 30000);
    </script>
