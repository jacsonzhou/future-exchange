version: '3.8'

# 🍀 P1: 监控与链路追踪基础设施
# 使用：docker-compose -f docker-compose.monitoring.yml up -d

services:
  # Prometheus - 指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: exchange-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - exchange-monitoring

  # Grafana - 可视化大盘
  grafana:
    image: grafana/grafana:latest
    container_name: exchange-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - exchange-monitoring

  # Zipkin - 链路追踪
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: exchange-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem  # 内存存储，生产环境建议用elasticsearch/mysql
    networks:
      - exchange-monitoring

  # Node Exporter - 主机监控（可选）
  node-exporter:
    image: prom/node-exporter:latest
    container_name: exchange-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - exchange-monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  exchange-monitoring:
    driver: bridge
