spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: true
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: true
        import-check:
          enabled: false
    
    gateway:
      # 全局过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      
      # 路由配置（当 Nacos 配置不可用时使用本地配置）
      routes:
        # ========== 行情数据服务 (market-price-core) ==========
        # K 线数据
        - id: market-price-klines
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/market/klines
          filters:
            - RewritePath=/api/v1/market/klines, /api/v1/klines
        
        # K 线数据 - 兼容旧路径
        - id: market-price-klines-legacy
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/klines/**
        
        # 深度数据
        - id: market-price-depth
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/market/depth
          filters:
            - SetPath=/api/v1/depth
        
        # 深度数据 - 兼容旧路径
        - id: market-price-depth-legacy
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/depth
        
        # Ticker 数据
        - id: market-price-ticker
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/market/ticker/24hr
          filters:
            - SetPath=/api/v1/ticker/24hr
        
        # Ticker 数据 - 兼容旧路径
        - id: market-price-ticker-legacy
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/ticker/24hr
        
        # 最优盘口
        - id: market-price-book-ticker
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/market/bookTicker
          filters:
            - SetPath=/api/v1/bookTicker
        
        # 最优盘口 - 兼容旧路径
        - id: market-price-book-ticker-legacy
          uri: lb://market-price-core
          predicates:
            - Path=/api/v1/bookTicker
        
        # ========== 订单服务 (oms-core) ==========
        - id: order-service-create
          uri: lb://oms-core
          predicates:
            - Path=/api/order/create
          filters:
            - RewritePath=/api/order/create, /api/v1/oms/order/submit

        # 撤单（兼容旧路径）
        - id: order-service-cancel-legacy
          uri: lb://oms-core
          predicates:
            - Path=/api/order/cancel
          filters:
            - RewritePath=/api/order/cancel, /api/v1/oms/order/cancel

        # 撤单（兼容 v1 简化路径）
        - id: order-service-cancel-v1
          uri: lb://oms-core
          predicates:
            - Path=/api/v1/order/cancel
          filters:
            - RewritePath=/api/v1/order/cancel, /api/v1/oms/order/cancel

        # 撤单（OMS 原生路径）
        - id: order-service-cancel
          uri: lb://oms-core
          predicates:
            - Path=/api/v1/oms/order/cancel
        
        # 订单列表查询
        - id: order-service-list
          uri: lb://oms-core
          predicates:
            - Path=/api/v1/oms/order/list
        
        # ========== 持仓服务 (position-snapshot-core) ==========
        - id: position-service
          uri: lb://position-snapshot-core
          predicates:
            - Path=/api/v1/position/**
        
        # ========== 账户快照服务 (snapshot-account-core) ==========
        - id: snapshot-service
          uri: lb://snapshot-account-core
          predicates:
            - Path=/api/v1/snapshot/**
          filters:
            - RewritePath=/api/v1/snapshot/(?<segment>.*), /api/v1/account/\${segment}
        
        # ========== 撮合引擎 (match-engine-core) ==========
        - id: match-engine-orderbook
          uri: lb://match-engine-core
          predicates:
            - Path=/api/v1/match/orderbook/**
        
        # ========== WebSocket 行情推送 (public-push-core) ==========
        - id: public-push-ws
          uri: lb:ws://public-push-core
          predicates:
            - Path=/ws/market/**

server:
  port: 8082

# Logging配置
logging:
  level:
    com.exchange.api-gateway: INFO
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/api-gateway.log

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,gateway,routes
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
