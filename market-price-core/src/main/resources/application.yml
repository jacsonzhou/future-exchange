server:
  port: 8095

spring:
  application:
    name: market-price-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        import-check:
          enabled: false

  # Kafka配置（消费trade-event，发布market.trade）
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: market-price-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

# Kafka Topic配置
kafka:
  topic:
    match-event: trade-event

market-data:
  external:
    enabled: ${MARKET_EXTERNAL_ENABLED:true}
    source: ${MARKET_EXTERNAL_SOURCE:binance}
    rest-base-url: ${MARKET_EXTERNAL_REST_BASE_URL:https://fapi.binance.com}
    symbols: ${MARKET_EXTERNAL_SYMBOLS:BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT}
    backfill:
      enabled: ${MARKET_EXTERNAL_BACKFILL_ENABLED:true}
      startup-delay-ms: ${MARKET_EXTERNAL_BACKFILL_STARTUP_DELAY_MS:5000}
      interval: ${MARKET_EXTERNAL_BACKFILL_INTERVAL:1m}
      initial-days: ${MARKET_EXTERNAL_BACKFILL_INITIAL_DAYS:365}
      batch-limit: ${MARKET_EXTERNAL_BACKFILL_BATCH_LIMIT:1500}
      request-delay-ms: ${MARKET_EXTERNAL_BACKFILL_REQUEST_DELAY_MS:50}
    ticker:
      external-fresh-ms: ${MARKET_EXTERNAL_TICKER_FRESH_MS:15000}
      fallback-refresh-ms: ${MARKET_EXTERNAL_TICKER_FALLBACK_REFRESH_MS:1000}

# Logging配置
logging:
  level:
    com.exchange.market-price-core: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/market-price-core.log
