<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合约交易K线图表</title>
    <!-- TradingView Charting Library -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #58a6ff; font-size: 18px; }
        
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 1px;
            background: #30363d;
            height: calc(100vh - 50px);
        }
        
        .panel {
            background: #0d1117;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .panel-header {
            background: #161b22;
            padding: 10px 15px;
            border-bottom: 1px solid #30363d;
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 盘口深度 */
        .orderbook {
            flex: 1;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
        }
        .orderbook-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 8px 10px;
            color: #8b949e;
            font-size: 11px;
            border-bottom: 1px solid #21262d;
            position: sticky;
            top: 0;
            background: #0d1117;
        }
        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 3px 10px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .orderbook-row:hover { background: #21262d; }
        .orderbook-ask { color: #f85149; }
        .orderbook-bid { color: #3fb950; }
        .orderbook-spread {
            text-align: center;
            padding: 8px;
            color: #8b949e;
            font-size: 12px;
            border-top: 1px solid #21262d;
            border-bottom: 1px solid #21262d;
            background: #161b22;
        }
        
        /* 图表区域 */
        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        #klineChart {
            width: 100%;
            height: 100%;
        }
        
        /* 图表工具栏 */
        .chart-toolbar {
            display: flex;
            gap: 5px;
            padding: 8px 15px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            align-items: center;
        }
        .chart-toolbar button {
            padding: 4px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .chart-toolbar button:hover { background: #30363d; }
        .chart-toolbar button.active { 
            background: #238636; 
            border-color: #238636;
            color: white;
        }
        .chart-toolbar .separator {
            width: 1px;
            height: 20px;
            background: #30363d;
            margin: 0 5px;
        }
        .current-price {
            margin-left: auto;
            font-size: 16px;
            font-weight: 600;
            font-family: 'SF Mono', monospace;
        }
        .current-price.up { color: #3fb950; }
        .current-price.down { color: #f85149; }
        
        /* 成交记录 */
        .trade-list {
            flex: 1;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
        }
        .trade-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 4px 10px;
            border-bottom: 1px solid #161b22;
        }
        .trade-item:hover { background: #161b22; }
        .trade-time { color: #8b949e; }
        .trade-price { text-align: right; }
        .trade-qty { text-align: right; color: #8b949e; }
        .trade-buy { color: #3fb950; }
        .trade-sell { color: #f85149; }
        
        /* 24h统计 */
        .ticker-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .ticker-stat {
            text-align: center;
        }
        .ticker-stat-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 2px;
        }
        .ticker-stat-value {
            font-size: 13px;
            font-weight: 600;
            font-family: 'SF Mono', monospace;
        }
        
        /* WebSocket状态 */
        .ws-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #21262d;
        }
        .ws-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .ws-status.connected { color: #3fb950; }
        .ws-status.connected::before { background: #3fb950; }
        .ws-status.disconnected { color: #f85149; }
        .ws-status.disconnected::before { background: #f85149; }
        .ws-status.connecting { color: #d29922; }
        .ws-status.connecting::before { background: #d29922; }
        
        /* 实时成交标记 */
        .price-pulse {
            animation: pulse 0.5s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            font-size: 14px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 BTCUSDT 永续合约</h1>
        <div style="display:flex;align-items:center;gap:15px;">
            <span id="wsStatus" class="ws-status disconnected">行情连接</span>
            <span id="lastUpdate" style="font-size:12px;color:#8b949e;">等待数据...</span>
        </div>
    </div>

    <div class="main-layout">
        <!-- 左侧：盘口深度 -->
        <div class="panel">
            <div class="panel-header">
                <span>📗 盘口深度</span>
                <span id="spreadValue" style="font-size:11px;color:#8b949e;">--</span>
            </div>
            <div class="orderbook" id="orderbook">
                <div class="loading">
                    <div class="spinner"></div>
                    等待WebSocket连接...
                </div>
            </div>
        </div>

        <!-- 中间：K线图表 -->
        <div class="panel">
            <div class="chart-toolbar">
                <button onclick="changeInterval('1m')" class="interval-btn active" data-interval="1m">1m</button>
                <button onclick="changeInterval('5m')" class="interval-btn" data-interval="5m">5m</button>
                <button onclick="changeInterval('15m')" class="interval-btn" data-interval="15m">15m</button>
                <button onclick="changeInterval('1h')" class="interval-btn" data-interval="1h">1h</button>
                <button onclick="changeInterval('4h')" class="interval-btn" data-interval="4h">4h</button>
                <button onclick="changeInterval('1d')" class="interval-btn" data-interval="1d">1d</button>
                <div class="separator"></div>
                <button onclick="chartType='candlestick'; updateChartType();" class="chart-type-btn active">K线</button>
                <button onclick="chartType='line'; updateChartType();" class="chart-type-btn">线形</button>
                <div class="current-price" id="currentPrice">--</div>
            </div>
            <div class="chart-container" id="chartContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    正在初始化图表...
                </div>
            </div>
        </div>

        <!-- 右侧：成交记录 + 统计 -->
        <div class="panel">
            <div class="ticker-stats">
                <div class="ticker-stat">
                    <div class="ticker-stat-label">24h涨跌</div>
                    <div class="ticker-stat-value" id="priceChange" style="color:#8b949e;">--</div>
                </div>
                <div class="ticker-stat">
                    <div class="ticker-stat-label">24h最高</div>
                    <div class="ticker-stat-value" id="high24h" style="color:#c9d1d9;">--</div>
                </div>
                <div class="ticker-stat">
                    <div class="ticker-stat-label">24h最低</div>
                    <div class="ticker-stat-value" id="low24h" style="color:#c9d1d9;">--</div>
                </div>
                <div class="ticker-stat">
                    <div class="ticker-stat-label">24h成交量</div>
                    <div class="ticker-stat-value" id="volume24h" style="color:#c9d1d9;">--</div>
                </div>
                <div class="ticker-stat">
                    <div class="ticker-stat-label">24h成交额</div>
                    <div class="ticker-stat-value" id="quoteVolume24h" style="color:#c9d1d9;">--</div>
                </div>
                <div class="ticker-stat">
                    <div class="ticker-stat-label">成交笔数</div>
                    <div class="ticker-stat-value" id="tradeCount24h" style="color:#c9d1d9;">--</div>
                </div>
            </div>
            <div class="panel-header">
                <span>📊 实时成交</span>
                <span style="font-size:11px;color:#8b949e;" id="tradeCount">0笔</span>
            </div>
            <div class="trade-list" id="tradeList">
                <div class="loading">等待成交数据...</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            MARKET_PRICE_API: 'http://localhost:8095',  // market-price-core API
            PUBLIC_PUSH_WS: 'ws://localhost:8096/ws/market',
            SYMBOL: 'BTCUSDT',
            DEFAULT_INTERVAL: '1m'
        };

        // ==================== 状态 ====================
        let state = {
            ws: null,
            currentInterval: CONFIG.DEFAULT_INTERVAL,
            chart: null,
            candlestickSeries: null,
            lineSeries: null,
            currentPrice: 0,
            lastPrice: 0,
            klineData: new Map(), // interval -> candle data array
            orderbook: { bids: [], asks: [] },
            ticker: null
        };

        let chartType = 'candlestick';

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            connectWebSocket();
        });

        // ==================== 图表初始化 ====================
        function initChart() {
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';

            const chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    background: { color: '#0d1117' },
                    textColor: '#8b949e',
                },
                grid: {
                    vertLines: { color: '#161b22' },
                    horzLines: { color: '#161b22' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        color: '#58a6ff',
                        labelBackgroundColor: '#58a6ff',
                    },
                    horzLine: {
                        color: '#58a6ff',
                        labelBackgroundColor: '#58a6ff',
                    },
                },
                rightPriceScale: {
                    borderColor: '#30363d',
                },
                timeScale: {
                    borderColor: '#30363d',
                    timeVisible: true,
                    secondsVisible: false,
                },
                handleScroll: {
                    vertTouchDrag: false,
                },
            });

            // 创建K线系列
            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#3fb950',
                downColor: '#f85149',
                borderUpColor: '#3fb950',
                borderDownColor: '#f85149',
                wickUpColor: '#3fb950',
                wickDownColor: '#f85149',
            });

            // 创建线形系列（备用）
            const lineSeries = chart.addLineSeries({
                color: '#58a6ff',
                lineWidth: 2,
            });
            lineSeries.applyOptions({ visible: false });

            // 添加成交量系列
            const volumeSeries = chart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: {
                    type: 'volume',
                },
                priceScaleId: '',
                scaleMargins: {
                    top: 0.85,
                    bottom: 0,
                },
            });

            // 保存引用
            state.chart = chart;
            state.candlestickSeries = candlestickSeries;
            state.lineSeries = lineSeries;
            state.volumeSeries = volumeSeries;

            // 自适应大小
            const resizeObserver = new ResizeObserver(entries => {
                if (entries.length === 0 || entries[0].contentRect.width === 0) return;
                const newRect = entries[0].contentRect;
                chart.applyOptions({ width: newRect.width, height: newRect.height });
            });
            resizeObserver.observe(chartContainer);

            // 加载真实历史K线数据
            fetchHistoricalKlines();
        }

        // 从 market-price-core 获取真实历史K线数据
        async function fetchHistoricalKlines() {
            const symbol = CONFIG.SYMBOL;
            const interval = state.currentInterval;
            
            console.log(`[Kline] 正在加载 ${symbol} ${interval} 历史K线数据...`);
            
            try {
                const response = await fetch(
                    `${CONFIG.MARKET_PRICE_API}/api/v1/klines?symbol=${symbol}&interval=${interval}&limit=200`
                );
                
                if (!response.ok) {
                    console.warn(`[Kline] API返回 ${response.status}，等待WebSocket实时数据...`);
                    showEmptyKlineChart();
                    return;
                }
                
                const result = await response.json();
                
                if (result.code !== 0 && result.code !== 200) {
                    throw new Error(result.message || '获取K线数据失败');
                }
                
                const klines = result.data || [];
                
                if (klines.length === 0) {
                    console.log('[Kline] 暂无历史K线数据，等待实时成交...');
                    showEmptyKlineChart();
                    return;
                }
                
                // 转换数据格式
                const candleData = [];
                const volumeData = [];
                
                klines.forEach(k => {
                    const openTime = Math.floor(k[0] / 1000);
                    const open = formatPrice(k[1]);
                    const high = formatPrice(k[2]);
                    const low = formatPrice(k[3]);
                    const close = formatPrice(k[4]);
                    const volume = formatQty(k[5]);
                    
                    candleData.push({
                        time: openTime,
                        open: open,
                        high: high,
                        low: low,
                        close: close
                    });
                    
                    volumeData.push({
                        time: openTime,
                        value: volume,
                        color: close >= open ? 'rgba(63, 185, 80, 0.5)' : 'rgba(248, 81, 73, 0.5)'
                    });
                });
                
                state.candlestickSeries.setData(candleData);
                state.volumeSeries.setData(volumeData);
                state.klineData.set(interval, candleData);
                
                const lastCandle = candleData[candleData.length - 1];
                updateCurrentPrice(lastCandle.close, lastCandle.close);
                
                console.log(`[Kline] 已加载 ${klines.length} 根真实K线数据`);
                
            } catch (err) {
                console.warn('[Kline] 历史K线暂未就绪，等待WebSocket实时数据...');
                showEmptyKlineChart();
            }
        }
        
        // 显示空K线图表
        function showEmptyKlineChart() {
            if (state.candlestickSeries) {
                state.candlestickSeries.setData([]);
            }
            if (state.volumeSeries) {
                state.volumeSeries.setData([]);
            }
        }
        
        // 兼容旧函数名
        function generateInitialData() {
            fetchHistoricalKlines();
        }

        // ==================== WebSocket连接 ====================
        function connectWebSocket() {
            updateWsStatus('connecting');
            
            try {
                state.ws = new WebSocket(CONFIG.PUBLIC_PUSH_WS);
                
                state.ws.onopen = () => {
                    updateWsStatus('connected');
                    document.getElementById('lastUpdate').textContent = '已连接，等待数据...';
                    
                    // 订阅频道
                    subscribeChannels();
                };
                
                state.ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        handleMessage(msg);
                    } catch (err) {
                        console.error('解析消息失败:', err);
                    }
                };
                
                state.ws.onclose = () => {
                    updateWsStatus('disconnected');
                    setTimeout(connectWebSocket, 5000);
                };
                
                state.ws.onerror = (err) => {
                    console.error('WebSocket错误:', err);
                    updateWsStatus('disconnected');
                };
            } catch (err) {
                console.error('连接失败:', err);
                updateWsStatus('disconnected');
            }
        }

        function subscribeChannels() {
            if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
            
            const channels = [
                `kline.${CONFIG.SYMBOL}.${state.currentInterval}`,
                `depth.${CONFIG.SYMBOL}`,
                `trade.${CONFIG.SYMBOL}`,
                `ticker.${CONFIG.SYMBOL}`
            ];
            
            state.ws.send(JSON.stringify({
                method: 'SUBSCRIBE',
                params: channels,
                id: Date.now()
            }));
        }

        // ==================== 消息处理 ====================
        function handleMessage(msg) {
            // 心跳
            if (msg.pong) return;
            
            // 订阅确认
            if (msg.result === 'subscribed') {
                console.log('订阅成功:', msg.data);
                return;
            }
            
            const channel = msg.stream || msg.e;
            if (!channel) return;
            
            const data = msg.data || msg;
            
            if (channel.startsWith('kline.')) {
                handleKlineMessage(data);
            } else if (channel.startsWith('depth.')) {
                handleDepthMessage(data);
            } else if (channel.startsWith('trade.')) {
                handleTradeMessage(data);
            } else if (channel.startsWith('ticker.') || channel === '24hrTicker') {
                handleTickerMessage(data);
            }
        }

        // 处理K线消息
        function handleKlineMessage(data) {
            if (!data.k) return;
            
            const k = data.k;
            const candle = {
                time: Math.floor(k.t / 1000),
                open: formatPrice(k.o),
                high: formatPrice(k.h),
                low: formatPrice(k.l),
                close: formatPrice(k.c)
            };
            
            const volume = {
                time: Math.floor(k.t / 1000),
                value: formatQty(k.v),
                color: k.c >= k.o ? 'rgba(63, 185, 80, 0.5)' : 'rgba(248, 81, 73, 0.5)'
            };
            
            // 更新图表
            state.candlestickSeries.update(candle);
            state.volumeSeries.update(volume);
            
            // 更新当前价格
            updateCurrentPrice(candle.close, state.lastPrice || candle.open);
            state.lastPrice = candle.close;
            
            // 更新时间
            document.getElementById('lastUpdate').textContent = 
                '最后更新: ' + new Date().toLocaleTimeString();
        }

        // 处理深度消息
        function handleDepthMessage(data) {
            const bids = data.b || data.bids || [];
            const asks = data.a || data.asks || [];
            
            state.orderbook.bids = bids.slice(0, 10);
            state.orderbook.asks = asks.slice(0, 10).reverse();
            
            updateOrderbookDisplay();
        }

        // 处理成交消息
        function handleTradeMessage(data) {
            const trades = Array.isArray(data) ? data : [data];
            const tradeList = document.getElementById('tradeList');
            
            // 如果有加载提示，清除它
            if (tradeList.querySelector('.loading')) {
                tradeList.innerHTML = '';
            }
            
            trades.forEach(trade => {
                const price = formatPrice(trade.p);
                const qty = formatQty(trade.q);
                const isBuy = !trade.m; // m = isBuyerMaker, false表示主动买入
                const time = new Date(trade.T || Date.now()).toLocaleTimeString('zh-CN', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
                
                const div = document.createElement('div');
                div.className = 'trade-item';
                div.innerHTML = `
                    <span class="trade-time">${time}</span>
                    <span class="trade-price ${isBuy ? 'trade-buy' : 'trade-sell'}">${price}</span>
                    <span class="trade-qty">${qty}</span>
                `;
                
                tradeList.insertBefore(div, tradeList.firstChild);
                
                // 限制数量
                while (tradeList.children.length > 100) {
                    tradeList.removeChild(tradeList.lastChild);
                }
                
                // 更新当前价格
                updateCurrentPrice(price, state.currentPrice);
            });
            
            // 更新成交计数
            document.getElementById('tradeCount').textContent = 
                tradeList.querySelectorAll('.trade-item').length + '笔';
        }

        // 处理Ticker消息
        function handleTickerMessage(data) {
            state.ticker = data;
            
            const priceChange = parseFloat(data.P || 0);
            const priceChangeVal = parseFloat(data.p || 0);
            const high24h = formatPrice(data.h || data.highPrice || 0);
            const low24h = formatPrice(data.l || data.lowPrice || 0);
            const volume = formatQty(data.v || data.volume || 0);
            const quoteVolume = formatMoney(data.q || data.quoteVolume || 0);
            const count = data.n || data.tradeCount || 0;
            
            // 更新显示
            const changeEl = document.getElementById('priceChange');
            changeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
            changeEl.style.color = priceChange >= 0 ? '#3fb950' : '#f85149';
            
            document.getElementById('high24h').textContent = high24h;
            document.getElementById('low24h').textContent = low24h;
            document.getElementById('volume24h').textContent = volume + ' BTC';
            document.getElementById('quoteVolume24h').textContent = quoteVolume + ' USDT';
            document.getElementById('tradeCount24h').textContent = count.toLocaleString();
        }

        // ==================== UI更新 ====================
        function updateOrderbookDisplay() {
            const container = document.getElementById('orderbook');
            
            let html = `
                <div class="orderbook-header">
                    <span>价格(USDT)</span>
                    <span>数量(BTC)</span>
                    <span>累计</span>
                </div>
            `;
            
            // 卖单（红色，倒序显示）
            state.orderbook.asks.forEach(([price, qty]) => {
                const priceVal = formatPrice(price);
                const qtyVal = formatQty(qty);
                html += `
                    <div class="orderbook-row orderbook-ask">
                        <span>${priceVal}</span>
                        <span>${qtyVal}</span>
                        <span>${(parseFloat(priceVal) * parseFloat(qtyVal)).toFixed(2)}</span>
                    </div>
                `;
            });
            
            // 价差
            const bestAsk = state.orderbook.asks[state.orderbook.asks.length - 1];
            const bestBid = state.orderbook.bids[0];
            if (bestAsk && bestBid) {
                const spread = formatPrice(bestAsk[0]) - formatPrice(bestBid[0]);
                const spreadPercent = (spread / formatPrice(bestBid[0]) * 100).toFixed(3);
                html += `
                    <div class="orderbook-spread">
                        价差: ${spread.toFixed(2)} (${spreadPercent}%)
                    </div>
                `;
                document.getElementById('spreadValue').textContent = 
                    '价差 ' + spread.toFixed(2);
            }
            
            // 买单（绿色）
            state.orderbook.bids.forEach(([price, qty]) => {
                const priceVal = formatPrice(price);
                const qtyVal = formatQty(qty);
                html += `
                    <div class="orderbook-row orderbook-bid">
                        <span>${priceVal}</span>
                        <span>${qtyVal}</span>
                        <span>${(parseFloat(priceVal) * parseFloat(qtyVal)).toFixed(2)}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function updateCurrentPrice(price, lastPrice) {
            state.currentPrice = price;
            const el = document.getElementById('currentPrice');
            el.textContent = parseFloat(price).toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });
            
            if (price > lastPrice) {
                el.className = 'current-price up price-pulse';
                setTimeout(() => el.classList.remove('price-pulse'), 500);
            } else if (price < lastPrice) {
                el.className = 'current-price down price-pulse';
                setTimeout(() => el.classList.remove('price-pulse'), 500);
            }
        }

        function updateWsStatus(status) {
            const el = document.getElementById('wsStatus');
            el.className = 'ws-status ' + status;
        }

        // ==================== 工具函数 ====================
        function changeInterval(interval) {
            // 更新按钮状态
            document.querySelectorAll('.interval-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.interval === interval);
            });
            
            state.currentInterval = interval;
            
            // 重新订阅
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                // 取消旧订阅
                state.ws.send(JSON.stringify({
                    method: 'UNSUBSCRIBE',
                    params: [`kline.${CONFIG.SYMBOL}.${state.currentInterval}`],
                    id: Date.now()
                }));
                
                // 订阅新周期
                state.ws.send(JSON.stringify({
                    method: 'SUBSCRIBE',
                    params: [`kline.${CONFIG.SYMBOL}.${interval}`],
                    id: Date.now()
                }));
            }
            
            // 重新生成数据
            generateInitialData();
        }

        function updateChartType() {
            // 更新按钮状态
            document.querySelectorAll('.chart-type-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', 
                    (chartType === 'candlestick' && idx === 0) || 
                    (chartType === 'line' && idx === 1)
                );
            });
            
            if (chartType === 'candlestick') {
                state.candlestickSeries.applyOptions({ visible: true });
                state.lineSeries.applyOptions({ visible: false });
            } else {
                state.candlestickSeries.applyOptions({ visible: false });
                state.lineSeries.applyOptions({ visible: true });
                
                // 转换K线数据为线形数据
                const lineData = state.klineData.get(state.currentInterval)?.map(d => ({
                    time: d.time,
                    value: d.close
                })) || [];
                state.lineSeries.setData(lineData);
            }
        }

        function getIntervalMs(interval) {
            const unit = interval.slice(-1);
            const value = parseInt(interval.slice(0, -1));
            const multipliers = { 's': 1000, 'm': 60 * 1000, 'h': 60 * 60 * 1000, 'd': 24 * 60 * 60 * 1000 };
            return value * (multipliers[unit] || 60000);
        }

        function formatPrice(price) {
            let num = parseFloat(price);
            // 内部格式是8位小数，需要转换
            if (num >= 1e8) {
                num = num / 1e8;
            }
            return num;
        }

        function formatQty(qty) {
            let num = parseFloat(qty);
            if (num >= 1e8) {
                num = num / 1e8;
            }
            return num.toFixed(4);
        }

        function formatMoney(amount) {
            let num = parseFloat(amount);
            if (num >= 1e8) {
                num = num / 1e8;
            }
            if (num >= 1e9) {
                return (num / 1e9).toFixed(2) + 'B';
            } else if (num >= 1e6) {
                return (num / 1e6).toFixed(2) + 'M';
            } else if (num >= 1e3) {
                return (num / 1e3).toFixed(2) + 'K';
            }
            return num.toFixed(2);
        }

        // 心跳
        setInterval(() => {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ ping: Date.now() }));
            }
        }, 30000);
    </script>
</body>
</html>
