# ============================================
# Market Price Core (行情生成服务) 配置 (dev环境)
# 端口: 8095
# ============================================

server:
  port: 8095

spring:
  application:
    name: market-price-service

  # Kafka配置
  kafka:
    producer:
      acks: 1
      linger-ms: 0
      retries: 3
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: latest
      enable-auto-commit: false
      fetch-min-bytes: 1
      fetch-max-wait-ms: 0
      max-poll-records: 500

# 行情数据输出配置
market-data:
  kafka:
    enabled: true
  output:
    standard-only: false
  kline:
    authority-enabled: false
    authority-source: binance
    backfill-with-watermark: false
    retention:
      enabled: true
      days: 365
      initial-delay-ms: 120000
      interval-ms: 86400000
    resume:
      enabled: false
      initial-delay-ms: 60000
      interval-ms: 60000
      interval: 1m
      chunk-candles: 1440
      max-catchup-days: 365
      max-segments-per-task: 512
      max-retries-per-segment: 3
      max-parallel-tasks: 1
      missing-repair-enabled: true
      missing-lookback-candles: 4320
      missing-max-segments: 64
    gap-repair:
      enabled: false
      initial-delay-ms: 120000
      interval-ms: 300000
      interval: 1m
      lookback-candles: 4320
      max-segments: 64
      skip-when-resume-running: true
  redis:
    pubsub-enabled: true
    snapshot-enabled: true
  external:
    enabled: true
    source: binance
    drop-out-of-order: true
    trade-drop-out-of-order: false
    rest-base-url: https://fapi.binance.com
    symbols: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
    backfill:
      enabled: false
      startup-delay-ms: 5000
      interval: 1m
      initial-days: 365
      batch-limit: 1500
      request-delay-ms: 50
    ticker:
      external-fresh-ms: 15000
      fallback-refresh-ms: 1000

# 行情服务配置
market-price:
  # K线配置
  kline:
    intervals: 1s,1m,5m,15m,30m,1h,2h,4h,6h,8h,12h,1d,3d,1w,1M
    cache-size: 1000
  # 深度配置
  depth:
    default-limit: 100
    max-limit: 1000
  # Ticker配置
  ticker:
    update-interval: 1000
    window-size: 86400
  # WebSocket配置
  websocket:
    max-connections: 100000
    heartbeat-interval: 30

# Kafka Topic配置
kafka:
  topic:
    match-event: trade-event
    depth-prefix: orderbook-delta-

# Logging配置
logging:
  level:
    com.exchange.market: INFO
    org.apache.kafka: WARN
