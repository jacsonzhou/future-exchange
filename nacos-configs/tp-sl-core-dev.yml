# ============================================
# TP/SL Core (止盈止损服务) 配置 (dev环境)
# 端口: 8089
# ============================================

server:
  port: 8089

spring:
  application:
    name: tp-sl-core

  datasource:
    url: jdbc:mysql://localhost:3306/future_exchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    consumer:
      group-id: tp-sl-group
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      retries: 3

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  mybatis-plus:
    type-aliases-package: com.exchange.tpsl.entity
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# TP/SL配置
tp-sl:
  # 滑点保护
  slippage:
    max-rate: 0.005
    limit-order-offset: 0.003
    limit-order-ttl: 10000

  # 触发配置
  trigger:
    confirmation-count: 2
    confirmation-interval: 100

  # 重试配置
  retry:
    max-attempts: 3
    intervals: 100,200,500

# Logging配置
logging:
  level:
    com.exchange.tpsl: INFO
    com.exchange.tpsl.service: DEBUG
    com.exchange.tpsl.consumer: DEBUG
