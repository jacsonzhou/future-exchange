# ============================================
# Position Snapshot Core (持仓快照服务) 配置 (dev环境)
# 端口: 8086
# ============================================

server:
  port: 8086

spring:
  application:
    name: position-snapshot-core
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/exchange_position?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
  
  # MyBatis Plus配置
  mybatis-plus:
    type-aliases-package: com.exchange.position.entity
    global-config:
      db-config:
        id-type: auto
  
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: position-service
      enable-auto-commit: false
      properties:
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    listener:
      concurrency: 1
      ack-mode: manual_immediate
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 2
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10

# Position配置
position:
  # Kafka消费的Topic列表
  kafka:
    # 标记价格消费组使用新组，避免历史积压回放导致估值滞后
    mark-price-group: position-mark-service-v2
    trade-entry-symbols: ""
    trade-topics: ""
    mark-price-topics: ""
    # 持仓变更事件Topic（供Private Push Service消费）
    position-change-topic: private-position-change
  
  # Redis缓存TTL（小时）
  redis:
    ttl-hours: 24
  
  # 风控阈值
  risk:
    margin-warning-ratio: 1.2
    liquidation-ratio: 1.0

# Logging配置
logging:
  level:
    root: INFO
    com.exchange: INFO
    com.exchange.position: DEBUG
