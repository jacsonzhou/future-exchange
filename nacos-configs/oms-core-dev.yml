# ============================================
# OMS Core (订单管理系统) 配置 (dev环境)
# 端口: 8081
# ============================================

server:
  port: 8081

spring:
  application:
    name: oms-core
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exchange_oms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # MyBatis Plus配置
  mybatis-plus:
    type-aliases-package: com.exchange.oms.entity
    configuration:
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  
  # Kafka配置（双通道架构）
  kafka:
    bootstrap-servers: localhost:9092
    # Producer配置（OMS → Match Engine）
    producer:
      # 性能优化配置
      acks: 1
      retries: 3
      linger-ms: 0
      compression-type: none
      batch-size: 16384
      buffer-memory: 33554432
      max-in-flight-requests-per-connection: 5
      request-timeout-ms: 30000
    
    # Consumer配置（Match Engine → OMS）
    consumer:
      group-id: oms-order-state
      enable-auto-commit: true
      auto-commit-interval-ms: 1000
      fetch-min-bytes: 1
      fetch-max-wait-ms: 0
      max-poll-records: 500
      session-timeout-ms: 30000
      heartbeat-interval-ms: 3000
  
  # Redis配置（保证金预扣）
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

# Logging配置
logging:
  level:
    com.exchange.oms: INFO
    com.exchange.oms.mapper: DEBUG
    com.exchange.oms.consumer: INFO
    com.exchange.oms.publisher: INFO

# ============================================================
# OMS核心配置：双通道架构
# ============================================================
exchange:
  oms:
    # 提交模式：kafka（生产推荐）| feign（降级/测试）
    submit-mode: feign
    
    # Kafka Topics配置
    kafka:
      # 订单状态推送 Topic（OMS → Private Push）
      private-order-state-topic: private-order-state

# ============================================================
# CFD 路由配置（C3）
# ============================================================
oms:
  execution:
    # 按任务单默认走 CFD，后续可按 symbol 细粒度调整
    default-mode: CFD_DEALER
    symbol-mode:
      BTCUSDT: CFD_DEALER
  kafka:
    cfd-order-command:
      topic-prefix: cfd-order-command-
