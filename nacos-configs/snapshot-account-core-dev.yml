# ============================================
# Snapshot Account Core (账户快照服务) 配置 (dev环境)
# 端口: 8085
# ============================================

server:
  port: 8085

spring:
  application:
    name: snapshot-account-core
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/exchange_snapshot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
  
  # MyBatis Plus配置
  mybatis-plus:
    type-aliases-package: com.exchange.snapshot.entity
    global-config:
      db-config:
        id-type: input
  
  # Kafka配置（消费LedgerEvent）
  kafka:
    consumer:
      group-id: snapshot-service
      enable-auto-commit: false
      properties:
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    listener:
      concurrency: 1
      ack-mode: manual_immediate
  
  # Redis配置（热数据缓存）
  redis:
    host: localhost
    port: 6379
    password: redis123456
    database: 1
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10

# 任务调度配置
spring.task.scheduling.pool.size: 5

# Snapshot配置
snapshot:
  # Kafka消费的Topic列表（多Symbol）
  # - trade-entry-{symbol}: 交易分录（驱动资产/持仓链路）
  # - account-entry-SYSTEM: SYSTEM账务分录（冻结/解冻等）
  kafka:
    topics: trade-entry-BTCUSDT,trade-entry-ETHUSDT,account-entry-SYSTEM
    # 账户UPNL联动消费（position-snapshot -> snapshot-account）
    position-change-topic: private-position-change
    # 使用新消费组跳过历史脏积压，直接对齐实时链路
    position-change-group: snapshot-position-service-v2
    # private-position-change 为多分区，高并发消费避免单线程滞后
    position-change-concurrency: 8

  account:
    position-upnl:
      # 账户总 UPNL 以持仓库汇总值为权威回补，修复 Redis 残留导致的总 UPNL 偏差
      db-fallback-enabled: true
      # 每个用户最小回补间隔（毫秒），兼顾准确性与数据库压力
      reconcile-interval-ms: 3000
  
  # Redis缓存TTL（小时）
  redis:
    ttl-hours: 24
  
  # Replay配置
  replay:
    batch-size: 1000

# Logging配置
logging:
  level:
    root: INFO
    com.exchange: INFO
    com.exchange.snapshot: DEBUG
