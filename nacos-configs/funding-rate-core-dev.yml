# ============================================
# Funding Rate Core (资金费率服务) 配置 (dev环境)
# 端口: 8088
# ============================================

server:
  port: 8088

spring:
  application:
    name: funding-rate-core
  
  datasource:
    url: jdbc:mysql://localhost:3306/exchange_funding?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
  
  kafka:
    producer:
      retries: 3
      acks: all
    consumer:
      group-id: funding-rate-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.exchange.*
  
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    lettuce:
      pool:
        max-active: 100
        max-idle: 50
        min-idle: 20

  # 定时任务配置
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: funding-schedule-

  mybatis-plus:
    type-aliases-package: com.exchange.funding.entity
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 资金费率配置
funding-rate:
  # 结算任务配置
  settlement:
    enabled: true
    cron: "0 0 0,8,16 * * ?"
    timeout: 60000

  # 预估费率更新
  estimate:
    enabled: true
    fixed-rate: 5000

  # 外部服务配置
  client:
    index-price:
      url: ${INDEX_PRICE_SERVICE_URL:http://localhost:8089}
      timeout: 3000
    mark-price:
      url: ${MARK_PRICE_SERVICE_URL:http://localhost:8089}
      timeout: 3000
    position:
      url: ${POSITION_SERVICE_URL:http://localhost:8084}
      timeout: 5000
    ledger:
      url: ${LEDGER_SERVICE_URL:http://localhost:8086}
      timeout: 5000

  # 重试配置
  retry:
    max-attempts: 5
    initial-interval: 60000
    multiplier: 2.0
    max-interval: 3600000

  # 分布式锁
  lock:
    enabled: true
    timeout: 60000

  # Kafka Topic配置
  kafka:
    topics:
      funding-rate-calc: funding-rate-calc
      funding-settlement: funding-settlement
      user-funding-fee: user-funding-fee

# Resilience4j配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      indexPriceService:
        baseConfig: default
      markPriceService:
        baseConfig: default
      positionService:
        baseConfig: default
        waitDurationInOpenState: 60s
      ledgerService:
        baseConfig: default
        failureRateThreshold: 30

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
    instances:
      indexPriceService:
        baseConfig: default
      markPriceService:
        baseConfig: default
      positionService:
        baseConfig: default
        maxAttempts: 2
      ledgerService:
        baseConfig: default
        maxAttempts: 5
        waitDuration: 2000

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: BASIC
  circuitbreaker:
    enabled: true

# Logging配置
logging:
  level:
    com.exchange.funding: INFO
