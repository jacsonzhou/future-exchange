# ============================================
# Market Price Core (行情数据服务) 配置 (dev环境)
# 端口: 8095
# ============================================

server:
  port: 8095

spring:
  application:
    name: market-price-core

  # ClickHouse 配置 (K线数据存储)
  clickhouse:
    url: jdbc:clickhouse://localhost:8123/exchange_kline
    user: default
    password: clickhouse123456
    socket-timeout: 120000
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 3
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
  
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market-price-service
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3

# 行情数据配置
market-data:
  kafka:
    enabled: true
  
  external:
    enabled: true
    source: binance
    rest-base-url: https://fapi.binance.com
    force-seek-to-end-on-assign: true
    consumer-auto-offset-reset: latest
    symbols: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
    backfill:
      enabled: false
      startup-delay-ms: 5000
      interval: 1m
      initial-days: 365
      batch-limit: 1500
      request-delay-ms: 50
    ticker:
      external-fresh-ms: 15000
      fallback-refresh-ms: 1000
  
  # K线配置
  kline:
    authority-enabled: true
    external-authoritative-enabled: true
    backfill-with-watermark: false
    authority-source: binance
    retention:
      enabled: true
      days: 365
      initial-delay-ms: 120000
      interval-ms: 86400000
    resume:
      enabled: false
      initial-delay-ms: 60000
      interval-ms: 60000
      interval: 1m
      chunk-candles: 1440
      max-catchup-days: 365
      max-segments-per-task: 512
      max-retries-per-segment: 3
      max-parallel-tasks: 1
      missing-repair-enabled: true
      missing-lookback-candles: 4320
      missing-max-segments: 64
    gap-repair:
      enabled: false
      initial-delay-ms: 120000
      interval-ms: 300000
      interval: 1m
      lookback-candles: 4320
      max-segments: 64
      skip-when-resume-running: true
    # 支持的周期
    intervals: 1s,1m,5m,15m,30m,1h,2h,4h,6h,8h,12h,1d,3d,1w,1M
    # 历史K线缓存条数
    history-limit: 1000
    # 实时保存间隔(秒)
    save-interval: 1
  
  # 聚合成交配置
  agg-trade:
    # 聚合窗口(ms)
    window-ms: 100
    # 批量大小
    batch-size: 100

# Logging配置
logging:
  level:
    root: INFO
    com.exchange.market: DEBUG
