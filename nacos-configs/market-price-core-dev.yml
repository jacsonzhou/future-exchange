# ============================================
# Market Price Core (行情数据服务) 配置 (dev环境)
# 端口: 8095
# ============================================

server:
  port: 8095

spring:
  application:
    name: market-price-core
  
  # 数据源配置 (MySQL - 用于Ticker等配置数据)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/exchange_market?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  
  # ClickHouse 配置 (K线数据存储)
  clickhouse:
    url: jdbc:clickhouse://localhost:8123/exchange_kline
    user: default
    password: clickhouse123456
    socket-timeout: 120000
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 3
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
  
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: market-price-service
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3

# 行情数据配置
market-data:
  kafka:
    enabled: true
  
  external:
    enabled: true
    source: binance
    rest-base-url: https://fapi.binance.com
    symbols: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
    backfill:
      enabled: true
      startup-delay-ms: 5000
      interval: 1m
      initial-days: 365
      batch-limit: 1500
      request-delay-ms: 50
    ticker:
      external-fresh-ms: 15000
      fallback-refresh-ms: 1000
  
  # K线配置
  kline:
    # 支持的周期
    intervals: 1s,1m,5m,15m,30m,1h,2h,4h,6h,8h,12h,1d,3d,1w,1M
    # 历史K线缓存条数
    history-limit: 1000
    # 实时保存间隔(秒)
    save-interval: 1
  
  # 聚合成交配置
  agg-trade:
    # 聚合窗口(ms)
    window-ms: 100
    # 批量大小
    batch-size: 100

# Logging配置
logging:
  level:
    root: INFO
    com.exchange.market: DEBUG
