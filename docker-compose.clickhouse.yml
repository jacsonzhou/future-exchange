# ============================================
# ClickHouse Docker Compose 配置
# 用于 K 线数据存储
# ============================================

services:
  clickhouse-server:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP 接口
      - "9000:9000"   # TCP 接口
    environment:
      CLICKHOUSE_DB: exchange_kline
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123456
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # 内存限制
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      - exchange-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Tabix Web UI (可视化管理工具)
  tabix:
    image: spoonest/clickhouse-tabix-web-client
    container_name: clickhouse-tabix
    restart: unless-stopped
    ports:
      - "8089:80"  # 使用 8089 避免端口冲突
    environment:
      CH_HOST: http://clickhouse-server:8123
    depends_on:
      - clickhouse-server
    networks:
      - exchange-network

volumes:
  clickhouse_data:
    driver: local

networks:
  exchange-network:
    driver: bridge
