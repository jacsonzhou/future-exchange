spring:
  application:
    name: match-engine-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml

  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        import-check:
          enabled: false

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  server:
    port: ${MANAGEMENT_PORT:8083}

match:
  wal:
    async-enabled: true
    batch-size: 1000
    flush-interval-ms: 10
  recovery:
    enabled: ${MATCH_RECOVERY_ENABLED:true}
    wal-file: ${MATCH_WAL_FILE:./data/wal/match.log}
    snapshot-file: ${MATCH_SNAPSHOT_FILE:./data/wal/orderbook.{symbol}.snapshot.json}
    max-commands: ${MATCH_RECOVERY_MAX_COMMANDS:10000000}

# Logging配置
logging:
  level:
    com.exchange.match-engine-core: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/match-engine-core.log
